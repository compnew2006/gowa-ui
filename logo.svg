<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      /* Light Mode / Default Variables */
      .bubble-bg {
        fill: url(#bubbleGradientLight);
        filter: drop-shadow(0 16px 24px rgba(0,0,0,0.15));
        transition: fill 0.4s ease, filter 0.4s ease;
      }
      
      .bot-face {
        fill: #FFFFFF;
        transition: fill 0.4s ease;
      }
      
      .bot-features {
        fill: #128C7E;
        stroke: #128C7E;
        transition: fill 0.4s ease, stroke 0.4s ease;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .bot-antenna {
        fill: #FFFFFF;
        stroke: #FFFFFF;
        transition: fill 0.4s ease, stroke 0.4s ease;
        stroke-linecap: round;
      }

      /* Dark Mode Variables */
      @media (prefers-color-scheme: dark) {
        .bubble-bg {
          fill: url(#bubbleGradientDark);
          filter: drop-shadow(0 16px 24px rgba(0,0,0,0.4));
        }

        .bot-face {
          fill: #25D366;
        }

        .bot-features {
          fill: #0F172A;
          stroke: #0F172A;
        }

        .bot-antenna {
          fill: #25D366;
          stroke: #25D366;
        }
      }
      
      /* Subtle hover animation */
      .bot-group {
        transform-origin: 256px 256px;
        transition: transform 0.3s ease;
      }
      .logo-svg:hover .bot-group {
        transform: translateY(-8px);
      }
    </style>

    <!-- Light Mode Gradient -->
    <linearGradient id="bubbleGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="100%" stop-color="#128C7E" />
    </linearGradient>

    <!-- Dark Mode Gradient -->
    <linearGradient id="bubbleGradientDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128C7E" />
      <stop offset="100%" stop-color="#075E54" />
    </linearGradient>

  </defs>

  <g class="logo-svg">
    <!-- The WhatsApp-style Chat Bubble -->
    <path class="bubble-bg" d="M256.06,42.49 C143.19,42.49 51.68,131.62 51.68,241.56 C51.68,284.97 66.24,325.2 90.58,358.5 L65.25,441.59 L152.6,419.26 C183.1,438.48 218.44,449.6 256.06,449.6 C368.93,449.6 460.44,360.47 460.44,250.53 C460.44,140.59 368.93,42.49 256.06,42.49 Z" />

    <!-- Chatbot Character -->
    <g class="bot-group">
      <!-- Antenna -->
      <line class="bot-antenna" x1="256" y1="126" x2="256" y2="166" stroke-width="14" />
      <circle class="bot-antenna" cx="256" cy="116" r="14" stroke-width="0" />

      <!-- Main Face Shield -->
      <rect class="bot-face" x="146" y="166" width="220" height="150" rx="45" />
      
      <!-- Eyes -->
      <circle class="bot-features" cx="210" cy="226" r="16" stroke-width="0" />
      <circle class="bot-features" cx="302" cy="226" r="16" stroke-width="0" />
      
      <!-- Smile / Data Connection -->
      <path class="bot-features" d="M 210 266 Q 256 296 302 266" fill="none" stroke-width="12" />
    </g>
  </g>
</svg>
