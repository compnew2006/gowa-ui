# Whatomate Configuration
# Copy this to config.toml and update values
#
# For Docker: use "db" and "redis" as hostnames
# For local dev: use "localhost"

[app]
name = "Whatomate"
environment = "development"  # development, staging, production
debug = true
encryption_key = ""  # AES-256 key for encrypting secrets at rest. Required for storing/updating account secrets; required in production.
allow_legacy_encryption = true  # Set false after running crypto-migrate to reject enc:/enc2: payloads.

[license]
enabled = false
public_key = ""  # Non-production-only override. Production builds must embed a key ring and leave this empty.
public_key_kid = ""
allow_unsafe_public_key_override = false  # Must be true when using public_key outside production.
fingerprint_sources = ["/etc/machine-id", "/sys/class/dmi/id/product_uuid"]
host_machine_id_path = ""  # In Docker on Linux, mount the host machine-id and set this to the mounted path, e.g. "/host/etc/machine-id".
# For Docker on Linux, also point fingerprint_sources at the mounted host paths instead of the container defaults:
# fingerprint_sources = ["/host/etc/machine-id", "/host/sys/class/dmi/id/product_uuid"]
rollback_tolerance_seconds = 900
grace_period_days = 7
enforce_on_workers = true

[server]
host = "0.0.0.0"
port = 8080
read_timeout = 30
write_timeout = 30
max_request_body_size_mb = 110  # Allows WhatsApp document uploads up to 100MB plus multipart overhead.
base_path = ""  # Set to "/subpath" if behind nginx proxy pass
allowed_origins = ""  # Comma-separated CORS/WS origins. Empty = same-origin + localhost loopback only.

[database]
host = "db"  # Use "localhost" for local development
port = 5432
user = "change-me"
password = "change-me"
name = "whatomate"
ssl_mode = "disable"
log_sql = false  # Set true only when you explicitly want raw GORM SQL query logs in the terminal.
max_open_conns = 25
max_idle_conns = 5
conn_max_lifetime = 300

[redis]
host = "redis"  # Use "localhost" for local development
port = 6379
password = ""
db = 0

[jwt]
secret = ""  # Required. Generate once: openssl rand -hex 32
access_expiry_mins = 15
refresh_expiry_days = 1

[whatsapp]
webhook_verify_token = "change-me"
api_version = "v18.0"
base_url = "https://graph.facebook.com"
provider = "meta" # meta, whatsmeow

[whatsmeow]
rate_limit_min_delay_ms = 1000
rate_limit_max_delay_ms = 3000
queue_timeout_seconds = 300
max_instances_per_org = 5
inbound_media_retry_count = 3
inbound_media_retry_delay_ms = 500
inbound_media_retry_max_delay_ms = 2000
inbound_media_async_retry_count = 4
inbound_media_async_retry_delay_ms = 5000
inbound_media_async_retry_max_delay_ms = 60000
identity = "" # Optional device label prefix shown on phone linked devices. Example: "whats" -> "whats+<instance name>"
health_monitor_interval_seconds = 30
reconnect_timeout_seconds = 45
typing_indicator_enabled = true
typing_min_delay_ms = 700
typing_max_delay_ms = 3000
typing_char_delay_ms = 35
typing_cooldown_ms = 4000

[storage]
type = "local"  # local, s3
local_path = "./uploads"
s3_bucket = ""
s3_region = ""
s3_key = ""
s3_secret = ""

# Auth cookie settings (tokens are stored in httpOnly cookies)
[cookie]
domain = ""    # Cookie domain (e.g., ".example.com"). Empty = current host only.
secure = false # Set Secure flag on cookies. Auto-set true when environment=production.

# Rate limiting for auth endpoints (uses Redis fixed-window counters)
[rate_limit]
enabled = true                 # Keep enabled in deployed environments
login_max_attempts = 10        # Max login attempts per IP per window
register_max_attempts = 10     # Max register attempts per IP per window
refresh_max_attempts = 30      # Max token refresh attempts per IP per window
sso_max_attempts = 10          # Max SSO init/callback attempts per IP per window
window_seconds = 60            # Time window in seconds
trust_proxy = false            # Trust X-Forwarded-For / X-Real-IP headers (set true behind reverse proxy)
outbound_per_user_per_second = 5   # Max outbound chat/canned sends per user per second
outbound_per_ip_per_second = 15    # Max outbound chat/canned sends per client IP per second

# Default admin credentials (only used during initial setup when no users exist)
[default_admin]
email = ""    # Optional bootstrap admin. Leave empty to disable auto-seeding.
password = "" # Optional bootstrap admin password (minimum 12 chars in production).
full_name = "Admin"
