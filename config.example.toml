# Gowa-UI Configuration
# Copy this to config.toml and update values
#
# For Docker: use "db" and "redis" as hostnames
# For local dev: use "localhost"

[app]
name = "Gowa-UI"
environment = "development"  # development, staging, production
debug = true
encryption_key = ""  # AES-256 key for encrypting secrets at rest (32+ chars, required in production)

[server]
host = "0.0.0.0"
port = 8080
read_timeout = 30
write_timeout = 30
base_path = ""  # Set to "/subpath" if behind nginx proxy pass
allowed_origins = ""  # Comma-separated CORS origins (e.g., "https://app.example.com,https://admin.example.com"). Empty = allow all (dev only).

[database]
host = "db"  # Use "localhost" for local development
port = 5432
user = "gowa-ui"
password = "gowa-ui"
name = "gowa-ui"
ssl_mode = "disable"
max_open_conns = 25
max_idle_conns = 5
conn_max_lifetime = 300

[redis]
host = "redis"  # Use "localhost" for local development
port = 6379
username = ""  # Redis ACL username (Redis 6+). Leave empty to use the default user.
password = ""
db = 0
tls = false    # Set to true for TLS connections (e.g. Upstash, Redis Cloud)

[jwt]
secret = "your-super-secret-jwt-key-change-in-production"  # Must be 32+ chars in production
access_expiry_mins = 15
refresh_expiry_days = 1

# GOWA (Go WhatsApp Web Multi-Device) connection settings. GOWA instances are
# usually managed in the UI (stored in the DB); this section configures the
# legacy/config-file fallback and webhook path.
[gowa]
webhook_path = "/api/gowa/webhook"
# Set ONLY when gowa-ui and GOWA run on the same host behind one reverse proxy:
# server→GOWA API calls then dial this loopback address instead of the public
# base_url (browser-facing URLs are unaffected). Leave empty otherwise, and
# especially when running multiple GOWA instances at different hosts.
#internal_base_url = "http://127.0.0.1:3000"

# Campaign send pacing. WhatsApp flags accounts that burst messages, so
# campaign sends can be capped per account. This is the FALLBACK budget
# (messages/minute); per-account overrides live in Settings -> Accounts.
# 0 = unlimited (pacing off) — enable on the accounts you send campaigns from.
[campaigns]
default_pacing_per_minute = 0

# Device-health alerts. When a WhatsApp account disconnects (logged out), the
# server writes an audit entry, pushes a device_alert over WebSocket, and —
# when these Telegram credentials are set — sends a message to the chat.
# Leave both empty to disable the Telegram push (audit + WS always stay on).
[alerts]
telegram_bot_token = ""
telegram_chat_id = ""

[storage]
type = "local"
local_path = "./uploads"

# Auth cookie settings (tokens are stored in httpOnly cookies)
[cookie]
domain = ""    # Cookie domain (e.g., ".example.com"). Empty = current host only.
secure = false # Set Secure flag on cookies. Auto-set true when environment=production.

# Rate limiting for auth endpoints (uses Redis fixed-window counters)
[rate_limit]
enabled = false                # Set to true to enable rate limiting (REQUIRED true in production — see wiring.go)
login_max_attempts = 10        # Max login attempts per IP per window
register_max_attempts = 10     # Max register attempts per IP per window
refresh_max_attempts = 30      # Max token refresh attempts per IP per window
sso_max_attempts = 10          # Max SSO init/callback attempts per IP per window
window_seconds = 60            # Time window in seconds
trust_proxy = false            # Trust X-Forwarded-For / X-Real-IP headers (set true behind reverse proxy)
api_max_requests = 200         # Max requests per IP per window for all /api/ routes (0 = 200)
api_window_seconds = 60        # Time window for global API rate limit (0 = 60)

# Default admin credentials (only used during initial setup when no users exist)
[default_admin]
email = "admin@admin.com"
password = "admin"
full_name = "Admin"
