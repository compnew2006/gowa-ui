services:
  # Whatomate app
  app:
    image: shridh0r/whatomate:latest
    container_name: whatomate_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - whatomate
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads:rw
      - ./config.toml:/app/config.toml:ro
      - /etc/machine-id:/host/etc/machine-id:ro
      - /sys/class/dmi/id/product_uuid:/host/sys/class/dmi/id/product_uuid:ro
    command: ["server", "-migrate", "-config", "/app/config.toml"]

  # PostgreSQL database
  db:
    image: postgres:17-alpine
    container_name: whatomate_db
    restart: unless-stopped
    networks:
      - whatomate
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatomate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatomate}
      POSTGRES_DB: ${POSTGRES_DB:-whatomate}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatomate} -d ${POSTGRES_DB:-whatomate}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:7-alpine
    container_name: whatomate_redis
    restart: unless-stopped
    networks:
      - whatomate
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  # MCP sidecar (optional profile)
  mcp-server:
    profiles: ["mcp"]
    build:
      context: ../mcp-server
    container_name: whatomate_mcp
    restart: unless-stopped
    networks:
      - whatomate
    depends_on:
      app:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      MCP_TRANSPORT: "http"
      MCP_HTTP_HOST: "0.0.0.0"
      MCP_HTTP_PORT: "3000"
      MCP_HTTP_BEARER_TOKEN: ${MCP_HTTP_BEARER_TOKEN:-change-me}
      MCP_ENABLE_LEGACY_SSE: ${MCP_ENABLE_LEGACY_SSE:-false}
      WHATOMATE_BASE_URL: "http://app:8080"
      WHATOMATE_API_KEY: ${WHATOMATE_API_KEY:-}
      WHATOMATE_ORGANIZATION_ID: ${WHATOMATE_ORGANIZATION_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
      LOG_FILE: /tmp/whatomate-mcp.log

networks:
  whatomate:

volumes:
  postgres-data:
  redis-data:
