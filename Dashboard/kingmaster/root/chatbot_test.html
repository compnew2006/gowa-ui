<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الشات بوت | Kingmaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/rtl-ltr.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .chat-container { display: flex; flex-direction: column; height: 100vh; max-width: 800px; margin: 0 auto; width: 100%; }
        
        .chat-header { background: var(--glass-bg); border-bottom: 1px solid var(--glass-border); padding: 1.5rem; backdrop-filter: blur(14px); }
        .chat-header h1 { color: #fff; font-size: 1.5rem; display: flex; align-items: center; gap: 0.75rem; }
        .chat-header .status { color: #4ade80; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem; margin-top: 0.5rem; }
        .status-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: pulse 2s infinite; }
        
        .chat-messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        
        .message { display: flex; gap: 0.75rem; max-width: 80%; animation: slideIn 0.3s ease; }
        .message.bot { align-self: flex-start; }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        
        .message-avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .message.bot .message-avatar { background: linear-gradient(135deg, #667eea, #764ba2); }
        .message.user .message-avatar { background: linear-gradient(135deg, #f093fb, #f5576c); }
        
        .message-content { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 0.75rem 1rem; backdrop-filter: blur(14px); }
        .message.user .message-content { background: linear-gradient(135deg, rgba(102,126,234,0.2), rgba(118,75,162,0.2)); }
        
        .message-text { color: #e5e7eb; line-height: 1.6; font-size: 0.95rem; }
        
        .message-image { max-width: 100%; border-radius: 8px; margin-top: 0.5rem; }
        
        .message-video { width: 100%; max-width: 400px; margin-top: 0.5rem; }
        .message-video video, .message-video iframe { width: 100%; border-radius: 8px; }
        
        .typing-indicator { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.5rem 0.75rem; }
        .typing-dot { width: 8px; height: 8px; background: #667eea; border-radius: 50%; animation: typingDot 1.4s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        .chat-input-container { background: var(--glass-bg); border-top: 1px solid var(--glass-border); padding: 1.5rem; backdrop-filter: blur(14px); }
        .chat-input-form { display: flex; gap: 0.75rem; }
        .chat-input { flex: 1; padding: 0.75rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; font-family: 'Cairo', sans-serif; font-size: 0.95rem; }
        .chat-input:focus { outline: none; border-color: #667eea; background: rgba(255,255,255,0.08); }
        
        .chat-send-btn { padding: 0.75rem 1.5rem; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 10px; font-family: 'Cairo', sans-serif; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .chat-send-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.4); }
        .chat-send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .load-flow-btn { position: fixed; bottom: 6rem; left: 2rem; background: rgba(239,68,68,0.9); color: #fff; border: none; border-radius: 50%; width: 50px; height: 50px; cursor: pointer; box-shadow: 0 4px 12px rgba(239,68,68,0.4); transition: all 0.2s; z-index: 100; }
        .load-flow-btn:hover { transform: scale(1.1); }
        
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes typingDot { 0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); } 30% { opacity: 1; transform: scale(1.2); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .welcome-message { text-align: center; color: #9ca3af; padding: 2rem; }
        .welcome-message i { font-size: 3rem; margin-bottom: 1rem; opacity: 0.3; }
    </style>
</head>
<body class="rtl ar">
    <div class="bg-gradient"></div>
    
    <div class="chat-container">
        <div class="chat-header">
            <h1>
                <i class="fas fa-robot"></i>
                اختبار الشات بوت
            </h1>
            <div class="status">
                <span class="status-dot"></span>
                متصل
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                <i class="fas fa-comments"></i>
                <p>مرحباً! ابدأ المحادثة...</p>
            </div>
        </div>
        
        <div class="chat-input-container">
            <form class="chat-input-form" id="chatForm">
                <input type="text" class="chat-input" id="chatInput" placeholder="اكتب رسالتك هنا..." autocomplete="off">
                <button type="submit" class="chat-send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </div>
    
    <button class="load-flow-btn" onclick="loadFlowData()" title="تحميل Flow">
        <i class="fas fa-upload"></i>
    </button>

    <script>
        let flowData = null;
        let currentNodeId = null;
        
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        
        // Load flow data
        function loadFlowData() {
            const jsonInput = prompt('الصق بيانات الـ Flow (JSON):');
            if (jsonInput) {
                try {
                    flowData = JSON.parse(jsonInput);
                    alert('تم تحميل الـ Flow بنجاح!');
                    resetChat();
                } catch (e) {
                    alert('خطأ في البيانات! تأكد من صحة الـ JSON');
                }
            }
        }
        
        function resetChat() {
            chatMessages.innerHTML = `
                <div class="welcome-message">
                    <i class="fas fa-comments"></i>
                    <p>تم تحميل الـ Flow! ابدأ المحادثة...</p>
                </div>
            `;
            currentNodeId = null;
        }
        
        // Add message to chat
        function addMessage(text, type, isTyping = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = type === 'bot' ? '<i class="fas fa-robot"></i>' : '<i class="fas fa-user"></i>';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            if (isTyping) {
                content.innerHTML = `
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                `;
            } else {
                content.innerHTML = `<div class="message-text">${text}</div>`;
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            
            const welcome = chatMessages.querySelector('.welcome-message');
            if (welcome) welcome.remove();
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            return messageDiv;
        }
        
        // Add media message
        function addMediaMessage(node) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
            
            const content = document.createElement('div');
            content.className = 'message-content';
            
            if (node.type === 'show-image') {
                content.innerHTML = `
                    <img src="${node.data.imageUrl}" alt="${node.data.imageAlt || 'صورة'}" class="message-image">
                    ${node.data.imageAlt ? `<div class="message-text" style="margin-top: 0.5rem;">${node.data.imageAlt}</div>` : ''}
                `;
            } else if (node.type === 'show-video') {
                const videoEmbed = getVideoEmbed(node.data.videoUrl);
                content.innerHTML = `
                    <div class="message-video">
                        ${videoEmbed}
                    </div>
                    ${node.data.videoTitle ? `<div class="message-text" style="margin-top: 0.5rem;">${node.data.videoTitle}</div>` : ''}
                `;
            }
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(content);
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Get video embed
        function getVideoEmbed(url) {
            const youtubeRegex = /(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/;
            const youtubeMatch = url.match(youtubeRegex);
            if (youtubeMatch) {
                return `<iframe width="100%" height="250" src="https://www.youtube.com/embed/${youtubeMatch[1]}" frameborder="0" allowfullscreen style="border-radius: 8px;"></iframe>`;
            }
            
            const vimeoRegex = /vimeo\.com\/(\d+)/;
            const vimeoMatch = url.match(vimeoRegex);
            if (vimeoMatch) {
                return `<iframe width="100%" height="250" src="https://player.vimeo.com/video/${vimeoMatch[1]}" frameborder="0" allowfullscreen style="border-radius: 8px;"></iframe>`;
            }
            
            return `<video controls style="width: 100%; border-radius: 8px;"><source src="${url}" type="video/mp4"></video>`;
        }
        
        // Process user message
        async function processMessage(userMessage) {
            if (!flowData) {
                addMessage('يرجى تحميل الـ Flow أولاً!', 'bot');
                return;
            }
            
            // Find keyword node
            const keywordNode = flowData.nodes.find(n => n.type === 'keywords');
            if (!keywordNode) {
                addMessage('لم يتم العثور على كلمات مفتاحية في الـ Flow', 'bot');
                return;
            }
            
            // Check if message matches keywords
            const matchType = keywordNode.data.matchType || 'contains';
            const keywords = keywordNode.data.keywords || [];
            let matched = false;
            
            for (const keyword of keywords) {
                if (matchType === 'contains') {
                    if (userMessage.includes(keyword)) {
                        matched = true;
                        break;
                    }
                } else if (matchType === 'equals') {
                    if (userMessage === keyword) {
                        matched = true;
                        break;
                    }
                }
            }
            
            if (!matched) {
                addMessage('عذراً، لم أفهم رسالتك. جرب إحدى الكلمات المفتاحية.', 'bot');
                return;
            }
            
            // Find next nodes
            const nextConnections = flowData.connections.filter(c => c.from === keywordNode.id);
            
            for (const conn of nextConnections) {
                const nextNode = flowData.nodes.find(n => n.id === conn.to);
                if (!nextNode) continue;
                
                await executeNode(nextNode);
            }
        }
        
        // Execute node
        async function executeNode(node) {
            if (node.type === 'send-text') {
                const text = node.data.messageText;
                const typingEnabled = node.data.typingEnabled;
                const typingDuration = parseInt(node.data.typingDuration || 3) * 1000;
                
                if (typingEnabled) {
                    const typingMsg = addMessage('', 'bot', true);
                    await sleep(typingDuration);
                    typingMsg.remove();
                }
                
                addMessage(text, 'bot');
                
                // Find next nodes
                const nextConnections = flowData.connections.filter(c => c.from === node.id);
                for (const conn of nextConnections) {
                    const nextNode = flowData.nodes.find(n => n.id === conn.to);
                    if (nextNode) {
                        await sleep(500);
                        await executeNode(nextNode);
                    }
                }
            } else if (node.type === 'show-image' || node.type === 'show-video') {
                await sleep(500);
                addMediaMessage(node);
                
                // Find next nodes
                const nextConnections = flowData.connections.filter(c => c.from === node.id);
                for (const conn of nextConnections) {
                    const nextNode = flowData.nodes.find(n => n.id === conn.to);
                    if (nextNode) {
                        await sleep(500);
                        await executeNode(nextNode);
                    }
                }
            }
        }
        
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }
        
        // Handle form submit
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = chatInput.value.trim();
            if (!message) return;
            
            addMessage(message, 'user');
            chatInput.value = '';
            
            await sleep(500);
            await processMessage(message);
        });
        
        // Auto-focus input
        chatInput.focus();
    </script>
</body>
</html>
