<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة الحساب | Kingmaster</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/rtl-ltr.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { color-scheme: dark; }
        body { font-family: 'Cairo', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; margin: 0; }
        .bg-gradient { position: fixed; inset: 0; z-index: -1; }
        
        .container { max-width: 500px; width: 100%; }
        
        .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; backdrop-filter: blur(14px); box-shadow: 0 8px 32px rgba(0,0,0,.35); padding: 2.5rem; text-align: center; }
        
        .icon-box { width: 80px; height: 80px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 2rem; color: #fff; box-shadow: 0 10px 30px rgba(102,126,234,.4); }
        
        h1 { font-size: 1.8rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
        
        p { color: #9ca3af; margin-bottom: 2rem; line-height: 1.6; }
        
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 1rem 2.5rem; border: none; border-radius: 12px; font-family: 'Cairo', sans-serif; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 0.6rem; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(102,126,234,.5); }

        
        /* Modal Styles */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; padding: 1rem; backdrop-filter: blur(8px); }
        .modal.show { display: flex; animation: fadeIn 0.3s ease; }
        
        .modal-content { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 20px; backdrop-filter: blur(14px); box-shadow: 0 20px 60px rgba(0,0,0,.5); max-width: 450px; width: 100%; padding: 2rem; position: relative; animation: slideUp 0.3s ease; }
        
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
        .modal-header h2 { font-size: 1.5rem; font-weight: 700; color: #fff; margin: 0; display: flex; align-items: center; gap: 0.5rem; }
        
        .close-btn { width: 35px; height: 35px; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 8px; color: #ef4444; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .close-btn:hover { background: rgba(239,68,68,0.2); transform: rotate(90deg); }
        
        .recovery-options { display: flex; flex-direction: column; gap: 1rem; }
        
        .recovery-option { background: rgba(255,255,255,0.05); border: 2px solid var(--glass-border); border-radius: 14px; padding: 1.25rem; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; gap: 1rem; }
        .recovery-option:hover { background: rgba(255,255,255,0.08); border-color: #667eea; transform: translateX(-5px); }
        
        .recovery-option .icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; }
        .recovery-option .icon.email { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .recovery-option .icon.whatsapp { background: rgba(34,197,94,0.15); color: #4ade80; }
        
        .recovery-option .text { flex: 1; text-align: right; }
        .recovery-option .text h3 { font-size: 1.1rem; font-weight: 600; color: #fff; margin: 0 0 0.3rem; }
        .recovery-option .text p { font-size: 0.85rem; color: #9ca3af; margin: 0; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .swal-rtl { font-family: 'Cairo', sans-serif !important; }
    </style>
</head>
<body class="rtl ar">
    <div class="bg-gradient"></div>
    
    <div class="container">
        <div class="card">
            <div class="icon-box">
                <i class="fas fa-shield-alt"></i>
            </div>
            <h1>استعادة الحساب</h1>
            <p>هل نسيت كلمة المرور؟ لا تقلق! يمكنك استعادة حسابك بسهولة عبر البريد الإلكتروني أو الواتساب</p>
            <button class="btn-primary" onclick="openModal()">
                <i class="fas fa-unlock-alt"></i>
                استعادة الحساب
            </button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="recoveryModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>
                <i class="fas fa-key"></i>
                اختر طريقة الاستعادة
            </h2>
            <button class="close-btn" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="recovery-options">
            <div class="recovery-option" onclick="sendRecovery('email')">
                <div class="icon email">
                    <i class="fas fa-envelope"></i>
                </div>
                <div class="text">
                    <h3>استعادة عبر البريد</h3>
                    <p>سيتم إرسال رمز الاستعادة إلى بريدك الإلكتروني</p>
                </div>
                <i class="fas fa-chevron-left" style="color:#9ca3af;"></i>
            </div>

            <div class="recovery-option" onclick="sendRecovery('whatsapp')">
                <div class="icon whatsapp">
                    <i class="fab fa-whatsapp"></i>
                </div>
                <div class="text">
                    <h3>استعادة عبر الواتساب</h3>
                    <p>سيتم إرسال رمز الاستعادة عبر الواتساب</p>
                </div>
                <i class="fas fa-chevron-left" style="color:#9ca3af;"></i>
            </div>
        </div>
    </div>
</div>


<script>
    function openModal() {
        document.getElementById('recoveryModal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('recoveryModal').classList.remove('show');
    }

    function sendRecovery(method) {
        closeModal();

        const messages = {
            email: {
                title: 'تم إرسال رمز الاستعادة!',
                text: 'تم إرسال رمز الاستعادة إلى بريدك الإلكتروني. يرجى التحقق من صندوق الوارد.',
                icon: 'success',
                iconColor: '#60a5fa'
            },
            whatsapp: {
                title: 'تم إرسال رمز الاستعادة!',
                text: 'تم إرسال رمز الاستعادة عبر الواتساب. يرجى التحقق من رسائلك.',
                icon: 'success',
                iconColor: '#4ade80'
            }
        };

        const msg = messages[method];

        Swal.fire({
            title: msg.title,
            text: msg.text,
            icon: msg.icon,
            iconColor: msg.iconColor,
            confirmButtonText: 'حسناً',
            confirmButtonColor: '#667eea',
            background: 'rgba(15, 23, 42, 0.95)',
            color: '#fff',
            backdrop: 'rgba(0,0,0,0.7)',
            customClass: {
                popup: 'swal-rtl'
            }
        });
    }

    // Close modal on outside click
    document.getElementById('recoveryModal').addEventListener('click', function (e) {
        if (e.target === this) {
            closeModal();
        }
    });

    // Close modal on ESC key
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            closeModal();
        }
    });
</script>
</body>
</html>
