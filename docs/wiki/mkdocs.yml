site_name: Whatomate Documentation
site_description: Complete bilingual documentation for the Whatomate WhatsApp Business API platform
site_author: Whatomate Team
site_url: https://docs.whatomate.com
docs_dir: .

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github

extra:
  alternate:
    - name: English
      link: /en/
      lang: en
      direction: ltr
    - name: العربية
      link: /ar/
      lang: ar
      direction: rtl
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/whatomate/whatomate
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/whatomate/whatomate
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - en
        - ar
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ar
          name: العربية
          default: false
          build: true
          nav_translations:
            Getting Started: البداية
            User Guide: دليل المستخدم
            Developer Guide: دليل المطور
            Admin Guide: دليل المدير
            FAQ: الأسئلة الشائعة
            Release Notes: ملاحظات الإصدار
            API Reference: مرجع واجهة البرمجة
            Architecture: البنية المعمارية
            Configuration: الإعدادات
            Deployment: النشر
            Contributing: المساهمة

nav:
