      - en/index.md
      - Overview: en/overview.md
      - Quick Start: en/quickstart.md
  - البداية:
      - ar/index.md
      - نظرة عامة: ar/overview.md
      - البدء السريع: ar/quickstart.md
  - البداية:
      - ar/index.md
      - نظرة عامة: ar/overview.md
      - البدء السريع: ar/quickstart.md
  - User Guide:
      - en/users/index.md
      - Authentication: en/users/authentication.md
      - Managing Contacts: en/users/contacts.md
      - Chat & Messaging: en/users/chat-messaging.md
      - Campaigns: en/users/campaigns.md
      - Chatbot & Automation: en/users/chatbot.md
      - Templates & Flows: en/users/templates-flows.md
      - Analytics & Reports: en/users/analytics.md
      - Canned Responses: en/users/canned-responses.md
      - Teams & Roles: en/users/teams-roles.md
      - Tags & Organization: en/users/tags-organization.md
  - Developer Guide:
      - en/developers/index.md
      - Architecture: en/developers/architecture.md
      - API Reference: en/developers/api-reference.md
      - Provider Abstraction: en/developers/provider-abstraction.md
      - WebSocket Events: en/developers/websocket-events.md
      - Webhook Integration: en/developers/webhook-integration.md
      - Background Workers: en/developers/background-workers.md
      - Database & Models: en/developers/database-models.md
      - Caching System: en/developers/caching.md
      - Testing: en/developers/testing.md
      - Contributing: en/developers/contributing.md
  - Admin Guide:
      - en/admins/index.md
      - Configuration: en/admins/configuration.md
      - Deployment: en/admins/deployment.md
      - Security: en/admins/security.md
      - Monitoring: en/admins/monitoring.md
      - Troubleshooting: en/admins/troubleshooting.md
      - Data Migration: en/admins/data-migration.md
      - Backup & Recovery: en/admins/backup-recovery.md
  - FAQ:
      - en/faq.md
  - Release Notes:
      - en/release-notes.md

