<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Master - تسجيل الدخول</title>
    
    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- أنماط CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/rtl-ltr.css">
    
    <!-- Timezone Utility -->
    <script src="js/timezones.js"></script>
    
    <!-- Internationalization -->
    <script src="js/i18n.js"></script>
    
    <!-- Country Detection -->
    <script src="js/country-detection.js"></script>
    
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            background-image: radial-gradient(circle at top right, rgba(108, 92, 231, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(0, 206, 201, 0.1), transparent 40%);
        }
        
        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: var(--spacing-xxl);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-glass);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xxl);
        }
        
        .auth-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto var(--spacing-lg);
            border-radius: var(--radius-lg);
            object-fit: contain;
        }
        
        .auth-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: var(--spacing-sm);
        }
        
        .auth-subtitle {
            color: var(--text-light-dark);
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-label {
            display: block;
            margin-bottom: var(--spacing-sm);
            color: var(--text-light);
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            height: 50px;
            padding: 0 var(--spacing-md);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            background: var(--glass-bg);
            color: var(--text-light);
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition-fast);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }
        
        .form-input::placeholder {
            color: var(--text-light-dark);
        }
        
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
        }
        
        .form-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--glass-border);
            border-radius: var(--radius-sm);
            background: var(--glass-bg);
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        .form-checkbox:checked {
            background: var(--primary);
            border-color: var(--primary);
        }
        
        .form-checkbox:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        .checkbox-label {
            color: var(--text-light-dark);
            font-size: 0.9rem;
            line-height: 1.4;
            cursor: pointer;
        }
        
        .checkbox-label a {
            color: var(--primary-light);
            text-decoration: none;
            transition: var(--transition-fast);
        }
        
        .checkbox-label a:hover {
            color: var(--primary);
            text-decoration: underline;
        }
        
        .submit-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }
        
        .submit-btn:hover {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .forgot-password {
            text-align: center;
            margin-bottom: var(--spacing-lg);
        }
        
        .forgot-password a {
            color: var(--primary-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: var(--transition-fast);
        }
        
        .forgot-password a:hover {
            color: var(--primary);
            text-decoration: underline;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: var(--spacing-xl);
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--glass-border);
        }
        
        .auth-footer p {
            color: var(--text-light-dark);
            margin-bottom: var(--spacing-sm);
        }
        
        .auth-footer a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition-fast);
        }
        
        .auth-footer a:hover {
            color: var(--primary);
            text-decoration: underline;
        }
        
        /* Light theme adjustments */
        .light-theme .auth-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .light-theme .auth-title {
            color: var(--text-dark);
        }
        
        .light-theme .form-label {
            color: var(--text-dark);
        }
        
        .light-theme .form-input {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: var(--text-dark);
        }
        
        .light-theme .form-input::placeholder {
            color: var(--text-dark-light);
        }
        
        .light-theme .form-checkbox {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid rgba(0, 0, 0, 0.2);
        }
        
        .light-theme .checkbox-label {
            color: var(--text-dark-light);
        }
        
        .light-theme .auth-footer p {
            color: var(--text-dark-light);
        }
        
        /* Responsive */
        @media (max-width: 576px) {
            .auth-container {
                padding: var(--spacing-md);
            }
            
            .auth-card {
                padding: var(--spacing-xl);
            }
            
            .auth-title {
                font-size: 1.5rem;
            }
        }
        
        .input-group {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            right: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light-dark);
            pointer-events: none;
        }
        
        body.ltr .input-icon {
            right: auto;
            left: var(--spacing-md);
        }
        
        .input-group .form-input {
            padding-right: calc(var(--spacing-md) * 2.5);
        }
        
        body.ltr .input-group .form-input {
            padding-right: var(--spacing-md);
            padding-left: calc(var(--spacing-md) * 2.5);
        }
        
        .password-toggle {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light-dark);
            cursor: pointer;
            font-size: 1rem;
        }
        
        body.ltr .password-toggle {
            left: auto;
            right: var(--spacing-md);
        }
        
        .password-toggle:hover {
            color: var(--primary-light);
        }
        
        .remember-me {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }
        
        .remember-checkbox {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }
    </style>
</head>
<body class="rtl ar">
    <!-- خلفية التدرج -->
    <div class="bg-gradient"></div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="images/logo.jpg" alt="King Master" class="auth-logo">
                <h1 class="auth-title" data-i18n="login_title">تسجيل الدخول</h1>
                <p class="auth-subtitle" data-i18n="login_subtitle">أدخل بياناتك للوصول إلى حسابك</p>
            </div>
            
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="email">
                        <i class="fas fa-envelope" style="margin-left: 5px;"></i>
                        <span data-i18n="email">البريد الإلكتروني</span>
                    </label>
                    <div class="input-group">
                        <input type="email" id="email" name="email" class="form-input" placeholder="أدخل بريدك الإلكتروني" data-i18n-placeholder="enter_email" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock" style="margin-left: 5px;"></i>
                        <span data-i18n="password">كلمة المرور</span>
                    </label>
                    <div class="input-group">
                        <input type="password" id="password" name="password" class="form-input" placeholder="أدخل كلمة المرور" data-i18n-placeholder="enter_password" required>
                        <i class="fas fa-lock input-icon"></i>
                        <button type="button" class="password-toggle" onclick="togglePassword('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="remember-me">
                    <div class="remember-checkbox">
                        <input type="checkbox" id="remember" name="remember" class="form-checkbox">
                        <label for="remember" class="checkbox-label" data-i18n="remember_me">تذكرني</label>
                    </div>
                    
                    <div class="forgot-password">
                        <a href="forgot-password" data-i18n="forgot_password">نسيت كلمة المرور؟</a>
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" class="form-checkbox" required>
                    <label for="terms" class="checkbox-label">
                        <span data-i18n="terms_agreement">أوافق على</span>
                        <a href="terms_privacy" target="_blank" data-i18n="terms_conditions">الشروط والأحكام</a>
                    </label>
                </div>
                
                <button type="submit" class="submit-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    <span data-i18n="login_btn">تسجيل الدخول</span>
                </button>
            </form>
            
            <div class="auth-footer">
                <p data-i18n="no_account">ليس لديك حساب؟</p>
                <a href="register" data-i18n="create_account_link">إنشاء حساب جديد</a>
            </div>
        </div>
    </div>
    
    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="header-icon" style="position: fixed; top: 20px; left: 20px; z-index: 1000;">
        <i class="fas fa-sun"></i>
    </button>
    
    <!-- Language Toggle Button -->
    <div class="language-dropdown" style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
        <button class="language-btn">
            <i class="fas fa-globe language-icon"></i>
            <span id="current-language" data-i18n="arabic">العربية</span>
            <i class="fas fa-chevron-down dropdown-arrow"></i>
        </button>
        <div class="language-dropdown-menu glass">
            <a href="#" class="dropdown-item active" data-lang="ar">
                <span class="dropdown-icon">🇪🇬</span>
                <span data-i18n="arabic">العربية</span>
            </a>
            <a href="#" class="dropdown-item" data-lang="en">
                <span class="dropdown-icon">🇺🇸</span>
                <span data-i18n="english">English</span>
            </a>
            <a href="#" class="dropdown-item" data-lang="fr">
                <span class="dropdown-icon">🇫🇷</span>
                <span data-i18n="french">Français</span>
            </a>
        </div>
    </div>
    
    <script>
        // Initialize page when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize language system
            if (typeof initializeLanguage === 'function') {
                initializeLanguage();
            }
        });

        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.password-toggle i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            // Validate form
            if (!validateLoginForm(data)) {
                return;
            }
            
            // Simulate login process
            const submitBtn = document.querySelector('.submit-btn');
            const currentLanguage = getCurrentLanguage();
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${t('logging_in', currentLanguage)}`;
            
            setTimeout(() => {
                alert(t('login_success', currentLanguage));
                // Redirect to dashboard
                window.location.href = 'index';
            }, 2000);
        });
        
        function validateLoginForm(data) {
            const currentLanguage = getCurrentLanguage();
            
            // Check if all required fields are filled
            if (!data.email || !data.password) {
                alert(t('fill_all_fields', currentLanguage));
                return false;
            }
            
            // Check terms agreement
            if (!data.terms) {
                alert(t('agree_to_terms', currentLanguage));
                return false;
            }
            
            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(data.email)) {
                alert(t('invalid_email', currentLanguage));
                return false;
            }
            
            // Basic password validation
            if (data.password.length < 6) {
                alert(t('password_too_short', currentLanguage));
                return false;
            }
            
            return true;
        }
        
        // Theme toggle functionality
        document.getElementById('theme-toggle').addEventListener('click', function() {
            document.body.classList.toggle('light-theme');
            const icon = this.querySelector('i');
            
            if (document.body.classList.contains('light-theme')) {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            } else {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        });
        
        // Language dropdown functionality
        document.querySelectorAll('.language-dropdown').forEach(dropdown => {
            dropdown.addEventListener('click', function(e) {
                e.stopPropagation();
                this.classList.toggle('active');
            });
        });
        
        // Language selection
        document.querySelectorAll('[data-lang]').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const lang = this.dataset.lang;
                
                // Update active state
                document.querySelectorAll('[data-lang]').forEach(el => el.classList.remove('active'));
                this.classList.add('active');
                
                // Change language using the i18n system
                if (typeof changeLanguage === 'function') {
                    changeLanguage(lang);
                }
                
                // Close dropdown
                document.querySelector('.language-dropdown').classList.remove('active');
            });
        });
        
        // Close dropdowns when clicking outside
        document.addEventListener('click', function() {
            document.querySelectorAll('.language-dropdown').forEach(dropdown => {
                dropdown.classList.remove('active');
            });
        });
    </script>
</body>
</html>
