<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شجرة الإحالات MLM | Kingmaster</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/rtl-ltr.css">
  <style>
    :root { 
      color-scheme: dark;
      --primary: #6c5ce7;
      --primary-light: #a29bfe;
      --secondary: #00cec9;
      --text-light: #f5f6fa;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }
    body { 
      font-family: 'Cairo', sans-serif;
      background: var(--bg-dark);
    }
    .bg-gradient { 
      position: fixed; 
      inset: 0; 
      z-index: -1;
      background-image: radial-gradient(circle at top right, rgba(108, 92, 231, 0.15), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(0, 206, 201, 0.1), transparent 40%);
    }
    .container { 
      max-width: 1600px; 
      margin: 0 auto; 
      padding: 2rem; 
    }
    
    .header-bar { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:2rem; flex-wrap:wrap; }
    .header-title { font-size:1.8rem; font-weight:700; color: var(--text-light); margin:0; display:flex; align-items:center; gap:.6rem; }
    
    .stats-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:1.5rem; margin-bottom:2rem; }
    .stat-card { background: var(--glass-bg); border:1px solid var(--glass-border); border-radius:16px; padding:1.5rem; text-align:center; }
    .stat-icon { font-size:2rem; margin-bottom:.75rem; color: var(--primary-light); }
    .stat-value { font-size:2rem; font-weight:700; color:#fff; margin-bottom:.25rem; }
    .stat-label { color:#9ca3af; font-size:.9rem; }
    
    .card { background: var(--glass-bg); border:1px solid var(--glass-border); border-radius: 20px; backdrop-filter: blur(14px); box-shadow: 0 8px 28px rgba(0,0,0,.35); padding: 2rem; margin-bottom:2rem; }
    
    /* Tree Styles */
    .tree-container { 
      overflow-x: auto;
      overflow-y: auto;
      padding: 3rem 2rem;
      min-height: 500px;
      background: linear-gradient(135deg, rgba(102,126,234,0.05) 0%, rgba(118,75,162,0.05) 100%);
      border-radius: 20px;
    }
    .tree { 
      display: flex; 
      justify-content: center;
      padding: 20px;
    }
    .tree ul { 
      padding-top: 50px; 
      position: relative; 
      transition: all 0.5s;
      display: flex;
      gap: 40px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .tree > ul {
      padding-top: 0;
    }
    
    .tree li { 
      text-align: center; 
      list-style-type: none; 
      position: relative; 
      padding: 50px 10px 0 10px; 
      transition: all 0.5s;
      display: inline-block;
    }
    
    .tree > ul > li {
      padding-top: 0;
    }
    
    /* خط رأسي من كل عقدة للأعلى */
    .tree li::before {
      content: '';
      position: absolute;
      top: -50px;
      left: 50%;
      border-left: 3px solid #4a90e2;
      width: 0;
      height: 50px;
    }
    
    /* خط أفقي يربط جميع الأبناء في نفس المستوى */
    .tree ul::before {
      content: '';
      position: absolute;
      top: -50px;
      left: 0;
      right: 0;
      border-top: 3px solid #4a90e2;
    }
    
    /* تعديل الخط ليربط من مركز أول عقدة لمركز آخر عقدة */
    .tree ul {
      position: relative;
    }
    
    /* لا خط أفقي للعنصر الوحيد */
    .tree ul li:only-child + li {
      display: none;
    }
    
    /* للعنصر الوحيد فقط خط رأسي */
    .tree ul:has(> li:only-child)::before {
      display: none;
    }
    
    /* إزالة الخط من فوق العقدة الرئيسية */
    .tree > ul > li::before {
      display: none;
    }
    
    .tree > ul::before {
      display: none;
    }
    
    .tree-node { 
      background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(248,250,252,0.95));
      border: 2px solid rgba(168,85,247,.3);
      border-radius: 16px;
      padding: 1.2rem;
      display: inline-block;
      min-width: 200px;
      max-width: 220px;
      position: relative;
      transition: all .3s ease;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(108,92,231,.15);
    }
    
    .tree-node:hover {
      transform: translateY(-8px) scale(1.08);
      box-shadow: 0 20px 50px rgba(108,92,231,.4);
      border-color: #667eea;
      background: linear-gradient(145deg, rgba(255,255,255,1), rgba(238,242,255,1));
    }
    
    .tree-node.root {
      background: linear-gradient(145deg, #667eea, #764ba2);
      border-color: #ffffff;
      border-width: 3px;
      box-shadow: 0 8px 25px rgba(102,126,234,.5);
    }
    
    .tree-node.root .name,
    .tree-node.root .username,
    .tree-node.root .level-badge {
      color: #ffffff !important;
    }
    
    .tree-node.root .avatar {
      background: rgba(255,255,255,0.3);
      border: 2px solid #ffffff;
    }
    
    .tree-node .avatar { 
      width: 60px; 
      height: 60px; 
      border-radius: 50%; 
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto .75rem;
      font-size: 1.5rem;
      color: #fff;
      font-weight: 700;
    }
    
    .tree-node .name { 
      font-size: 1.1rem; 
      font-weight: 700; 
      color: #1f2937; 
      margin-bottom: .4rem; 
    }
    .tree-node .username { 
      font-size: .9rem; 
      color: #6b7280; 
      margin-bottom: .6rem; 
      font-weight: 500;
    }
    .tree-node .level-badge {
      display: inline-block;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #ffffff;
      padding: .3rem .9rem;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 600;
      margin-bottom: .6rem;
      box-shadow: 0 2px 8px rgba(102,126,234,.3);
    }
    .tree-node .stats {
      display: flex;
      justify-content: space-around;
      gap: .8rem;
      margin-top: .9rem;
      padding-top: .9rem;
      border-top: 2px solid rgba(102,126,234,.15);
    }
    .tree-node .stat-item {
      text-align: center;
      flex: 1;
    }
    .tree-node .stat-item i {
      font-size: 1rem;
      margin-bottom: .3rem;
      display: block;
    }
    .tree-node .stat-item div {
      font-size: .85rem;
      color: #374151;
      font-weight: 600;
    }
    
    .loading { text-align:center; padding:3rem; color:#9ca3af; }
    
    .zoom-controls {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 1000;
    }
    .zoom-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-btn:hover {
      background: var(--primary);
      transform: scale(1.1);
    }
    
    @media (max-width: 768px) {
      .tree-node { min-width: 150px; padding: .75rem; }
      .tree-node .avatar { width: 50px; height: 50px; }
    }
  </style>
</head>
<body class="rtl ar">
  <div class="bg-gradient"></div>
  <div class="container">
    <div class="header-bar">
      <h1 class="header-title"><i class="fas fa-sitemap"></i> شجرة الإحالات - <span id="current_user_name"></span></h1>
      <button onclick="window.location.href='mlm_login.html'" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; padding: 10px 20px; border-radius: 10px; cursor: pointer;">
        <i class="fas fa-user-circle"></i> تغيير الحساب
      </button>
    </div>

    <!-- Statistics -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-users"></i></div>
        <div class="stat-value" id="total_downline">0</div>
        <div class="stat-label">إجمالي الفريق</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-layer-group"></i></div>
        <div class="stat-value" id="total_levels">5</div>
        <div class="stat-label">عدد المستويات</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-dollar-sign"></i></div>
        <div class="stat-value" id="total_earnings">0.00</div>
        <div class="stat-label">إجمالي الأرباح (ر.س)</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-user-plus"></i></div>
        <div class="stat-value" id="direct_referrals">0</div>
        <div class="stat-label">إحالات مباشرة</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="fas fa-user-group"></i></div>
        <div class="stat-value" id="indirect_referrals">0</div>
        <div class="stat-label">إحالات غير مباشرة</div>
      </div>
    </div>

    <!-- Tree -->
    <div class="card">
      <h3 style="color:#fff; font-size:1.15rem; font-weight:600; margin:0 0 2rem; display:flex; align-items:center; gap:.6rem; padding-bottom:.75rem; border-bottom: 1px solid rgba(255,255,255,.08);">
        <i class="fas fa-project-diagram"></i> الهيكل الشجري للإحالات
      </h3>
      <div class="tree-container" id="tree_container">
        <div class="loading">
          <i class="fas fa-spinner fa-spin" style="font-size:2rem;"></i>
          <div style="margin-top:1rem;">جارٍ تحميل الشجرة...</div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Zoom Controls -->
  <div class="zoom-controls">
    <button class="zoom-btn" onclick="zoomIn()" title="تكبير">
      <i class="fas fa-plus"></i>
    </button>
    <button class="zoom-btn" onclick="zoomOut()" title="تصغير">
      <i class="fas fa-minus"></i>
    </button>
    <button class="zoom-btn" onclick="resetZoom()" title="إعادة تعيين">
      <i class="fas fa-sync-alt"></i>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    // الحصول على معرف المستخدم من localStorage
    const CURRENT_USER_ID = parseInt(localStorage.getItem('mlm_user_id')) || 1;
    const CURRENT_USER_NAME = localStorage.getItem('mlm_user_name') || 'مستخدم';
    
    // عرض اسم المستخدم
    document.getElementById('current_user_name').textContent = CURRENT_USER_NAME;
    
    // تحميل الشجرة
    async function loadTree() {
      const container = document.getElementById('tree_container');
      container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin" style="font-size:2rem;"></i><div style="margin-top:1rem;">جارٍ تحميل الشجرة...</div></div>';

      try {
        const response = await fetch(`api/get_mlm_tree.php?user_id=${CURRENT_USER_ID}&max_levels=5`);
        const result = await response.json();

        if (result.success) {
          // تحديث الإحصائيات
          document.getElementById('total_downline').textContent = result.total_downline;
          document.getElementById('total_earnings').textContent = parseFloat(result.user.total_earnings).toFixed(2);
          document.getElementById('direct_referrals').textContent = result.user.direct_referrals;
          document.getElementById('indirect_referrals').textContent = result.user.total_referrals - result.user.direct_referrals;

          // رسم الشجرة
          container.innerHTML = '<div class="tree">' + buildTreeHTML(result.user, true) + '</div>';
        } else {
          container.innerHTML = '<div class="loading" style="color:#f87171;"><i class="fas fa-exclamation-triangle"></i><div>فشل تحميل الشجرة</div></div>';
        }
      } catch (error) {
        container.innerHTML = '<div class="loading" style="color:#f87171;"><i class="fas fa-exclamation-triangle"></i><div>خطأ في الاتصال</div></div>';
      }
    }

    // بناء HTML للشجرة
    function buildTreeHTML(user, isRoot = false) {
      const initial = user.full_name.charAt(0);
      const rootClass = isRoot ? ' root' : '';
      
      let html = `
        <ul>
          <li>
            <div class="tree-node${rootClass}" onclick="showUserDetails(${user.id})">
              <div class="avatar">${initial}</div>
              <div class="level-badge">المستوى ${user.current_level + 1}</div>
              <div class="name">${user.full_name}</div>
              <div class="username">@${user.username}</div>
              <div class="stats">
                <div class="stat-item" title="مباشر">
                  <i class="fas fa-user-friends" style="color: #4ade80;"></i>
                  <div>${user.direct_referrals || 0}</div>
                </div>
                <div class="stat-item" title="غير مباشر">
                  <i class="fas fa-user-group" style="color: #60a5fa;"></i>
                  <div>${(user.total_referrals || 0) - (user.direct_referrals || 0)}</div>
                </div>
                <div class="stat-item" title="إجمالي">
                  <i class="fas fa-users" style="color: #a78bfa;"></i>
                  <div>${user.total_referrals || 0}</div>
                </div>
                <div class="stat-item">
                  <i class="fas fa-dollar-sign"></i>
                  <div>${parseFloat(user.total_earnings).toFixed(0)}</div>
                </div>
              </div>
            </div>
      `;

      if (user.children && user.children.length > 0) {
        html += '<ul>';
        user.children.forEach(child => {
          html += '<li>' + buildTreeHTML(child).replace(/<\/?ul>/g, '') + '</li>';
        });
        html += '</ul>';
      }

      html += '</li></ul>';
      return html;
    }

    // عرض تفاصيل المستخدم
    function showUserDetails(userId) {
      Swal.fire({
        title: 'تفاصيل المستخدم',
        html: `
          <div style="text-align:right; padding:1rem;">
            <p><strong>معرف المستخدم:</strong> ${userId}</p>
            <p>يمكنك إضافة المزيد من التفاصيل هنا...</p>
          </div>
        `,
        icon: 'info',
        confirmButtonText: 'حسناً',
        confirmButtonColor: '#6c5ce7'
      });
    }

    // تحميل الشجرة عند فتح الصفحة
    loadTree();
    
    // التحكم في الزووم
    let currentZoom = 0.8;
    
    function zoomIn() {
      currentZoom = Math.min(currentZoom + 0.1, 1.5);
      document.getElementById('tree_container').style.zoom = currentZoom;
    }
    
    function zoomOut() {
      currentZoom = Math.max(currentZoom - 0.1, 0.3);
      document.getElementById('tree_container').style.zoom = currentZoom;
    }
    
    function resetZoom() {
      currentZoom = 0.8;
      document.getElementById('tree_container').style.zoom = currentZoom;
    }
  </script>
</body>
</html>
