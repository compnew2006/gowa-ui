<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>King Master - تسجيل حساب جديد</title>
    
    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- أنماط CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/rtl-ltr.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.43/moment-timezone-with-data.min.js"></script>


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            background-image: radial-gradient(circle at top right, rgba(108, 92, 231, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(0, 206, 201, 0.1), transparent 40%);
        }
        
        .auth-card {
            width: 100%;
            max-width: 500px;
            padding: var(--spacing-xxl);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-glass);
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: var(--spacing-xxl);
        }
        
        .auth-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto var(--spacing-lg);
            border-radius: var(--radius-lg);
            object-fit: contain;
        }
        
        .auth-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: var(--spacing-sm);
        }
        
        .auth-subtitle {
            color: var(--text-light-dark);
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: var(--spacing-lg);
        }
        
        .form-label {
            display: block;
            margin-bottom: var(--spacing-sm);
            color: var(--text-light);
            font-weight: 500;
        }
        
        .form-input {
            width: 100%;
            height: 50px;
            padding: 0 var(--spacing-md);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            background: var(--glass-bg);
            color: var(--text-light);
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition-fast);
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }
        
        .form-input::placeholder {
            color: var(--text-light-dark);
        }
        
        .form-select {
            width: 100%;
            height: 50px;
            padding: 0 var(--spacing-md);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            background: var(--glass-bg);
            color: var(--text-light);
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition-fast);
            cursor: pointer;
        }
        
        .form-select:focus {
            outline: none;
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }
        
        .form-select option {
            background: var(--bg-dark-light);
            color: var(--text-light);
        }
        
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-xl);
        }
        
        .form-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--glass-border);
            border-radius: var(--radius-sm);
            background: var(--glass-bg);
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            margin-top: 2px;
        }
        
        .form-checkbox:checked {
            background: var(--primary);
            border-color: var(--primary);
        }
        
        .form-checkbox:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        .checkbox-label {
            color: var(--text-light-dark);
            font-size: 0.9rem;
            line-height: 1.4;
            cursor: pointer;
        }
        
        .checkbox-label a {
            color: var(--primary-light);
            text-decoration: none;
            transition: var(--transition-fast);
        }
        
        .checkbox-label a:hover {
            color: var(--primary);
            text-decoration: underline;
        }
        
        .submit-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            color: var(--text-light);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }
        
        .submit-btn:hover {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: var(--spacing-xl);
            padding-top: var(--spacing-lg);
            border-top: 1px solid var(--glass-border);
        }
        
        .auth-footer p {
            color: var(--text-light-dark);
            margin-bottom: var(--spacing-sm);
        }
        
        .auth-footer a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition-fast);
        }
        
        .auth-footer a:hover {
            color: var(--primary);
            text-decoration: underline;
        }
        
        /* Light theme adjustments */
        .light-theme .auth-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .light-theme .auth-title {
            color: var(--text-dark);
        }
        
        .light-theme .form-label {
            color: var(--text-dark);
        }
        
        .light-theme .form-input,
        .light-theme .form-select {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.1);
            color: var(--text-dark);
        }
        
        .light-theme .form-input::placeholder {
            color: var(--text-dark-light);
        }
        
        .light-theme .form-select option {
            background: white;
            color: var(--text-dark);
        }
        
        .light-theme .form-checkbox {
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid rgba(0, 0, 0, 0.2);
        }
        
        .light-theme .checkbox-label {
            color: var(--text-dark-light);
        }
        
        .light-theme .auth-footer p {
            color: var(--text-dark-light);
        }
        
        /* Responsive */
        @media (max-width: 576px) {
            .auth-container {
                padding: var(--spacing-md);
            }
            
            .auth-card {
                padding: var(--spacing-xl);
            }
            
            .auth-title {
                font-size: 1.5rem;
            }
        }
        
        .input-group {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            right: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light-dark);
            pointer-events: none;
        }
        
        body.ltr .input-icon {
            right: auto;
            left: var(--spacing-md);
        }
        
        .input-group .form-input {
            padding-right: calc(var(--spacing-md) * 2.5);
        }
        
        body.ltr .input-group .form-input {
            padding-right: var(--spacing-md);
            padding-left: calc(var(--spacing-md) * 2.5);
        }
        
        .password-toggle {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-light-dark);
            cursor: pointer;
            font-size: 1rem;
        }
        
        body.ltr .password-toggle {
            left: auto;
            right: var(--spacing-md);
        }
        
        .password-toggle:hover {
            color: var(--primary-light);
        }

        /* Select2 dark theme overrides */
        .select2-container .select2-selection--single {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            height: 50px;
            border-radius: var(--radius-md);
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            color: var(--text-light);
            line-height: 48px;
            padding-right: var(--spacing-md);
        }
        .select2-container--default .select2-selection--single .select2-selection__placeholder{
            color: var(--text-light-dark);
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 48px;
            right: 10px;
        }
        .select2-dropdown {
            background: rgba(17,24,39,0.95);
            border: 1px solid var(--glass-border);
        }
        .select2-results__option { color: var(--text-light); }
        .select2-results__option--highlighted[aria-selected] {
            background: rgba(108,92,231,0.25);
            color: #fff;
        }
        .select2-search--dropdown .select2-search__field {
            background: rgba(17,24,39,0.85);
            color: var(--text-light);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
        }
        /* Light theme fixes */
        .light-theme .select2-container .select2-selection--single {
            background: rgba(255,255,255,0.9);
            border: 1px solid rgba(0,0,0,0.1);
        }
        .light-theme .select2-container--default .select2-selection--single .select2-selection__rendered { color: var(--text-dark); }
        .light-theme .select2-dropdown { background: #fff; border: 1px solid rgba(0,0,0,0.1); }
        .light-theme .select2-results__option { color: var(--text-dark); }
        .light-theme .select2-search--dropdown .select2-search__field { background: #fff; color: var(--text-dark); border: 1px solid rgba(0,0,0,0.1); }
    </style>
</head>
<body class="rtl ar">
    <!-- خلفية التدرج -->
    <div class="bg-gradient"></div>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <img src="images/logo.jpg" alt="King Master" class="auth-logo">
                <h1 class="auth-title" data-i18n="create_account">إنشاء حساب جديد</h1>
                <p class="auth-subtitle" data-i18n="create_account_subtitle">انضم إلينا واستمتع بأفضل أدوات التسويق الرقمي</p>
            </div>
            
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="fullName">
                        <i class="fas fa-user" style="margin-left: 5px;"></i>
                        <span data-i18n="full_name">الاسم الكامل</span>
                    </label>
                    <div class="input-group">
                        <input type="text" id="fullName" name="fullName" class="form-input" placeholder="أدخل اسمك الكامل" data-i18n-placeholder="enter_full_name" required>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="email">

                    </label>
                    <div class="input-group">
                        <input type="email" id="email" name="email" class="form-input" placeholder="أدخل بريدك الإلكتروني" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>
                
                <div class="form-group">

                <div class="form-group">

                    <div class="input-group">

                        <i class="fas fa-briefcase input-icon"></i>

                </div>

                    </label>
                    <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:.5rem;">
                        <select id="dob_day" name="dob_day" class="form-select" aria-label="اليوم">
                            <option value="">اليوم</option>

    <!-- Theme Toggle Button -->

        <button class="language-btn">
            <i class="fas fa-globe language-icon"></i>
            <span id="current-language">العربية</span>
            <i class="fas fa-chevron-down dropdown-arrow"></i>

        <div class="language-dropdown-menu glass">
            <a href="#" class="dropdown-item active" data-lang="ar">
                <span class="dropdown-icon">🇪🇬</span>
                <span>العربية</span>
            </a>
            <a href="#" class="dropdown-item" data-lang="en">
                <span class="dropdown-icon">🇺🇸</span>
                        <span data-i18n="english">English</span>

                <span class="dropdown-icon">🇫🇷</span>
                        <span data-i18n="french">Français</span>

<script>
    // ✅ الحصول على كل المناطق الزمنية من النظام
    const timezones = Intl.supportedValuesOf('timeZone');
    timezones.sort((a, b) => a.localeCompare(b));
    const select = document.getElementById('timezone');
    timezones.forEach(tz => { const opt = document.createElement('option'); opt.value = tz; opt.textContent = tz; select.appendChild(opt); });

    // ✅ تعبئة اليوم/الشهر/السنة لتاريخ الميلاد
    const daySel = document.getElementById('dob_day');
    const monthSel = document.getElementById('dob_month');
    const yearSel = document.getElementById('dob_year');
    if (daySel && monthSel && yearSel){
        for(let d=1; d<=31; d++){ const o=document.createElement('option'); o.value=String(d).padStart(2,'0'); o.textContent=d; daySel.appendChild(o); }
        const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
        months.forEach((m,i)=>{ const o=document.createElement('option'); o.value=String(i+1).padStart(2,'0'); o.textContent=m; monthSel.appendChild(o); });
        const currentYear = new Date().getFullYear();
        for(let y=currentYear-10; y>=1940; y--){ const o=document.createElement('option'); o.value=String(y); o.textContent=y; yearSel.appendChild(o); }
        const validateDob=()=>{
            const dd=daySel.value, mm=monthSel.value, yy=yearSel.value; const hint=document.getElementById('dob_hint');
            if(!dd && !mm && !yy){ if(hint) hint.style.display='none'; return true; }
            const dNum=parseInt(dd), mNum=parseInt(mm)-1, yNum=parseInt(yy);
            const dt=new Date(yNum, mNum, dNum);
            const ok = !!yy && !!mm && !!dd && dt.getFullYear()===yNum && dt.getMonth()===mNum && dt.getDate()===dNum;
            if(hint) hint.style.display = ok? 'none':'block';
            return ok;
        };
        daySel.addEventListener('change', validateDob);
        monthSel.addEventListener('change', validateDob);
        yearSel.addEventListener('change', validateDob);
        window.__validateDob = validateDob;
    }
</script>



    <script>
        // Initialize page when DOM is loaded
    if (window.jQuery && $.fn && $.fn.select2){
        $(function(){ $('#timezone').select2({ placeholder: "ابحث عن منطقة زمنية...", width: '100%' }); });
    }


        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.password-toggle i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
        
        // Form submission
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData);
            
            // Validate form
            if (!validateForm(data)) {
                return;
            }
            // توجيه مباشرة إلى صفحة OTP مع تمرير رقم الهاتف
            const phoneVal = (data.phone || '').trim();
            window.location.href = 'otp.html?phone=' + encodeURIComponent(phoneVal);
        });
        
        function validateForm(data) {
            // Check if all required fields are filled
            const required = ['fullName', 'email', 'password', 'phone', 'timezone'];
            for (let field of required) {
                if (!data[field] || data[field].trim() === '') {
                    alert('يرجى ملء جميع الحقول المطلوبة');
                    return false;
                }
            }
            // DOB optional لكن إن تم اختيار جزء، نتحقق من الصلاحية
            if (typeof window.__validateDob === 'function' && !window.__validateDob()){
                alert('تاريخ الميلاد غير صالح');
                return false;
            }
            
            // Check terms agreement
            if (!data.terms) {
                alert('يجب الموافقة على الشروط والأحكام');
                return false;
            }
            
            // Validate email format
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(data.email)) {
                alert('يرجى إدخال بريد إلكتروني صحيح');
                return false;
            }
            
            // Validate password length
            if (data.password.length < 6) {
                alert('يجب أن تكون كلمة المرور 6 أحرف على الأقل');
                return false;
            }
            
            return true;
        }
        
        // Theme toggle functionality
        document.getElementById('theme-toggle').addEventListener('click', function() {
            document.body.classList.toggle('light-theme');
            const icon = this.querySelector('i');
            
            if (document.body.classList.contains('light-theme')) {
                icon.classList.remove('fa-sun');
                icon.classList.add('fa-moon');
            } else {
                icon.classList.remove('fa-moon');
                icon.classList.add('fa-sun');
            }
        });
        
        // Language dropdown functionality
        document.querySelectorAll('.language-dropdown').forEach(dropdown => {
            dropdown.addEventListener('click', function(e) {
                e.stopPropagation();
                this.classList.toggle('active');
            });
        });
        
        // Language selection
        document.querySelectorAll('[data-lang]').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                const lang = this.dataset.lang;
                const currentLang = document.getElementById('current-language');
                
                // Update active state
                document.querySelectorAll('[data-lang]').forEach(el => el.classList.remove('active'));
                this.classList.add('active');
                
                // Update body classes and direction
                if (lang === 'ar') {
                    document.body.className = 'rtl ar';
                    document.documentElement.dir = 'rtl';
                    document.documentElement.lang = 'ar';
                    currentLang.textContent = 'العربية';
                } else if (lang === 'en') {
                    document.body.className = 'ltr en';
                    document.documentElement.dir = 'ltr';
                    document.documentElement.lang = 'en';
                    currentLang.textContent = 'English';
                } else if (lang === 'fr') {
                    document.body.className = 'ltr fr';
                    document.documentElement.dir = 'ltr';
                    document.documentElement.lang = 'fr';
                    currentLang.textContent = 'Français';
                }
                
                // Close dropdown
                document.querySelector('.language-dropdown').classList.remove('active');
            });
        });
        
        // Close dropdowns when clicking outside
        document.addEventListener('click', function() {
            document.querySelectorAll('.language-dropdown').forEach(dropdown => {
                dropdown.classList.remove('active');
            });
        });
        
    </script>




</body>
</html>
