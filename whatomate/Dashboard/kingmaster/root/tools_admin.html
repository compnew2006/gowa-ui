<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>King Master - إدارة الأدوات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/rtl-ltr.css">
  <style>
    :root { color-scheme: dark; }
    .content-admin-container { min-height:100vh; position:relative; z-index:1; }
    .main-content { padding:0; }
    .content-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; flex-wrap:wrap; gap:1rem; }
    .content-title { font-size:2rem; font-weight:700; color:var(--text-light); margin:0; }
    .content-actions { display:flex; gap:1rem; align-items:center; flex-wrap:wrap; }
    .search-box { position:relative; min-width:300px; }
    .search-box input { width:100%; padding:0.75rem 1rem 0.75rem 3rem; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-md); color:var(--text-light); font-size:0.9rem; }
    .search-box i { position:absolute; right:1rem; top:50%; transform:translateY(-50%); color:var(--text-light-dark); }
    .add-content-btn { background:linear-gradient(135deg, var(--primary), var(--primary-light)); color:#fff; border:none; padding:0.75rem 1.5rem; border-radius:var(--radius-md); font-weight:600; display:flex; align-items:center; gap:0.5rem; cursor:pointer; transition:all .3s ease; }
    .add-content-btn:hover { transform:translateY(-2px); box-shadow:var(--shadow-lg); }

    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:1rem; margin-bottom:2rem; }
    .stat-card { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:1.5rem; text-align:center; backdrop-filter:blur(10px); }
    .stat-number { font-size:2rem; font-weight:700; color:var(--primary-light); margin-bottom:.5rem; display:block; }
    .stat-label { color:var(--text-light-dark); font-size:.9rem; }

    .filter-section { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); padding:1.5rem; margin-bottom:2rem; backdrop-filter:blur(10px); }
    .filter-row { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:1rem; align-items:end; }
    .filter-group label { display:block; margin-bottom:.5rem; color:var(--text-light); font-weight:500; font-size:.9rem; }
    .filter-group select, .filter-group input { width:100%; padding:.75rem; background:rgba(17,24,39,0.85); border:1px solid var(--glass-border); border-radius:var(--radius-md); color:var(--text-light); font-size:.9rem; }
    .filter-group select option, .form-group select option { background:#111827; color:#F3F4F6; }

    .contents-table-container { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); overflow:hidden; backdrop-filter:blur(10px); }
    .contents-table { width:100%; border-collapse:collapse; }
    .contents-table th, .contents-table td { padding:1rem; text-align:right; border-bottom:1px solid rgba(255,255,255,.1); }
    .contents-table th { background:rgba(108,92,231,.1); color:var(--text-light); font-weight:600; position:sticky; top:0; z-index:10; }
    .contents-table td { color:var(--text-light-dark); }
    .checkbox-cell { width:40px; text-align:center; }

    .category-badge { display:inline-block; padding:.25rem .5rem; border:1px solid var(--glass-border); border-radius:var(--radius-md); background:rgba(255,255,255,.08); }

    /* Modal */
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; z-index:1000; opacity:0; visibility:hidden; transition:all .3s ease; }
    .modal-overlay.active { opacity:1; visibility:visible; }
    .modal { background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:var(--radius-lg); backdrop-filter:blur(20px); max-width:700px; width:95%; max-height:90vh; overflow-y:auto; transform:scale(.95); transition:all .3s ease; }
    .modal-overlay.active .modal { transform:scale(1); }
    .modal-header { padding:1rem 1.5rem; border-bottom:1px solid rgba(255,255,255,.1); display:flex; justify-content:space-between; align-items:center; }
    .modal-title { margin:0; color:var(--text-light); font-size:1.25rem; font-weight:600; }
    .modal-close { background:none; border:none; color:var(--text-light-dark); font-size:1.5rem; cursor:pointer; width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:var(--radius-sm); }
    .modal-body { padding:1.25rem 1.5rem; }
    .form-group { margin-bottom:1rem; }
    .form-group label { display:block; margin-bottom:.5rem; color:var(--text-light); font-weight:500; }
    .form-group input, .form-group select { width:100%; padding:.75rem; background:rgba(17,24,39,0.85); border:1px solid var(--glass-border); border-radius:var(--radius-md); color:var(--text-light); font-size:.9rem; }
    .form-help { color:var(--text-light-dark); font-size:.8rem; margin-top:.25rem; }
    .modal-footer { padding:1rem 1.5rem; border-top:1px solid rgba(255,255,255,.1); display:flex; gap:.5rem; justify-content:flex-end; flex-wrap:wrap; }

    .btn { padding:0.65rem 1.25rem; border:none; border-radius:var(--radius-md); font-weight:600; cursor:pointer; transition:all .3s ease; display:flex; align-items:center; gap:.5rem; }
    .btn-primary { background:linear-gradient(135deg, var(--primary), var(--primary-light)); color:#fff; }
    .btn-secondary { background:var(--glass-bg); color:var(--text-light-dark); border:1px solid var(--glass-border); }
    .action-buttons { display:flex; gap:.5rem; align-items:center; }
    .action-btn { width:32px; height:32px; border:none; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .3s ease; font-size:.8rem; }
    .btn-edit { background:rgba(59,130,246,.2); color:#3B82F6; border:1px solid #3B82F6; }
    .btn-edit:hover { background:#3B82F6; color:#fff; }
    .btn-delete { background:rgba(239,68,68,.2); color:#EF4444; border:1px solid #EF4444; }
    .btn-delete:hover { background:#EF4444; color:#fff; }
  </style>
</head>
<body class="rtl ar">
  <div class="bg-gradient"></div>
  <div class="dashboard-container content-admin-container">
    <div class="main-content" style="max-width: 1400px; margin: 0 auto; padding: 2rem;">
      <div class="content-header">
        <div class="content-title"><i class="fas fa-toolbox" style="margin-left:.5rem;"></i> إدارة الأدوات</div>
        <div class="content-actions">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="ابحث عن أداة...">
            <i class="fas fa-search"></i>
          </div>
          <button class="add-content-btn" onclick="openToolModal()"><i class="fas fa-plus"></i> إضافة أداة</button>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-card"><span class="stat-number" id="statTotal">0</span><div class="stat-label">إجمالي الأدوات</div></div>
        <div class="stat-card"><span class="stat-number" id="statWorking">0</span><div class="stat-label">تعمل</div></div>
        <div class="stat-card"><span class="stat-number" id="statNotWorking">0</span><div class="stat-label">لا تعمل</div></div>
        <div class="stat-card"><span class="stat-number" id="statVisible">0</span><div class="stat-label">مرئية</div></div>
        <div class="stat-card"><span class="stat-number" id="statHidden">0</span><div class="stat-label">غير مرئية</div></div>
      </div>

      <div class="filter-section">
        <div class="filter-row">
          <div class="filter-group">
            <label>الحالة</label>
            <select id="statusFilter">
              <option value="">الكل</option>
              <option value="working">تعمل</option>
              <option value="not_working">لا تعمل</option>
            </select>
          </div>
          <div class="filter-group">
            <label>الظهور</label>
            <select id="visibleFilter">
              <option value="">الكل</option>
              <option value="1">مرئية</option>
              <option value="0">غير مرئية</option>
            </select>
          </div>
          <div class="filter-group">
            <label>عدد العناصر</label>
            <div class="count-display"><span class="count-number" id="displayCount">0</span> <span>عنصر</span></div>
          </div>
          <div class="filter-actions">
            <button class="btn btn-secondary" onclick="deleteSelected()"><i class="fas fa-trash"></i> حذف المحدد</button>
          </div>
        </div>
      </div>

      <div class="contents-table-container">
        <table class="contents-table">
          <thead>
            <tr>
              <th class="checkbox-cell"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()"></th>
              <th>اسم الأداة</th>
              <th>الحالة</th>
              <th>الظهور</th>
              <th>آخر تعديل</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="toolsTableBody">
            <tr><td colspan="6" class="table-loading"><div class="loading-spinner"></div><div>جاري التحميل...</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="toolModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">إضافة أداة</h3>
        <button class="modal-close" onclick="closeToolModal()"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group"><label>اسم الأداة</label><input type="text" id="tlName" placeholder="مثال: أداة الاستخراج"></div>
        <div class="form-group"><label>الحالة</label>
          <select id="tlStatus"><option value="working">تعمل</option><option value="not_working">لا تعمل</option></select>
        </div>
        <div class="form-group"><label>الظهور</label>
          <label style="display:flex; align-items:center; gap:.5rem;"><input type="checkbox" id="tlVisible" checked> <span>مرئية</span></label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeToolModal()">إلغاء</button>
        <button class="btn btn-primary" onclick="saveTool()"><i class="fas fa-save"></i> حفظ</button>
      </div>
    </div>
  </div>

  <script>
    let tools = []; let filtered=[]; let selected=[]; let editId=null;

    document.addEventListener('DOMContentLoaded', ()=>{
      loadTools();
      document.getElementById('searchInput').addEventListener('input', applyFilters);
      document.getElementById('statusFilter').addEventListener('change', applyFilters);
      document.getElementById('visibleFilter').addEventListener('change', applyFilters);
    });

    async function loadTools(){
      try{ const res=await fetch('api/tools_api.php'); const data=await res.json(); if(!data.success) throw new Error(data.message||'fail'); tools=data.data||[]; filtered=tools; renderTable(); updateStats(); }
      catch(e){ Swal.fire({icon:'error', title:'خطأ', text:'فشل تحميل الأدوات'}); }
    }

    function applyFilters(){
      const q=document.getElementById('searchInput').value.toLowerCase();
      const st=document.getElementById('statusFilter').value; const vis=document.getElementById('visibleFilter').value;
      filtered = tools.filter(t=>{
        const mq=(t.name||'').toLowerCase().includes(q);
        const ms=!st || (t.status||'working')===st;
        const mv=!vis || String(t.visible||0)===vis;
        return mq && ms && mv;
      });
      renderTable(); updateStats();
    }

    function renderTable(){
      const tbody=document.getElementById('toolsTableBody');
      if (!filtered.length){ tbody.innerHTML='<tr><td colspan="6" class="table-loading">لا توجد أدوات</td></tr>'; document.getElementById('displayCount').textContent=0; return; }
      tbody.innerHTML = filtered.map(t=>`
        <tr>
          <td class="checkbox-cell"><input type="checkbox" onchange="toggleSelection(${t.id}, this.checked)" ${selected.includes(t.id)?'checked':''}></td>
          <td style="color:var(--text-light); font-weight:600;">${escapeHtml(t.name)}</td>
          <td><span class="category-badge">${t.status==='working'?'تعمل':'لا تعمل'}</span></td>
          <td><span class="category-badge">${(t.visible? 'مرئية':'غير مرئية')}</span></td>
          <td style="font-size:.85rem; color:var(--text-light-dark);">${formatDate(t.updated_at)}</td>
          <td>
            <div class="action-buttons">
              <button class="action-btn btn-edit" title="تعديل" onclick="editTool(${t.id})"><i class="fas fa-edit"></i></button>
              <button class="action-btn btn-delete" title="حذف" onclick="deleteTool(${t.id})"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>
      `).join('');
      document.getElementById('displayCount').textContent=filtered.length;
    }

    function updateStats(){
      setText('statTotal', tools.length);
      setText('statWorking', tools.filter(t=> (t.status||'working')==='working').length);
      setText('statNotWorking', tools.filter(t=> (t.status||'working')==='not_working').length);
      setText('statVisible', tools.filter(t=> (t.visible?1:0)===1).length);
      setText('statHidden', tools.filter(t=> (t.visible?1:0)===0).length);
    }

    function setText(id,v){ const el=document.getElementById(id); if (el) el.textContent=v; }
    function toggleSelectAll(){ const all=document.getElementById('selectAll'); document.querySelectorAll('#toolsTableBody input[type="checkbox"]').forEach(cb=>{ cb.checked=all.checked; const id=parseInt(cb.getAttribute('onchange').match(/\d+/)[0]); toggleSelection(id, cb.checked); }); }
    function toggleSelection(id,checked){ if(checked){ if(!selected.includes(id)) selected.push(id);} else { selected=selected.filter(x=>x!==id);} }

    function openToolModal(){ editId=null; document.getElementById('modalTitle').textContent='إضافة أداة'; setVal('tlName',''); setVal('tlStatus','working'); setChecked('tlVisible',true); document.getElementById('toolModal').classList.add('active'); }
    function closeToolModal(){ document.getElementById('toolModal').classList.remove('active'); }

    function editTool(id){
      const t = tools.find(x=>x.id===id);
      if(!t){ Swal.fire({icon:'error', title:'خطأ', text:'العنصر غير موجود'}); return; }
      editId = id;
      document.getElementById('modalTitle').textContent = 'تعديل أداة';
      setVal('tlName', t.name || '');
      setVal('tlStatus', t.status || 'working');
      setChecked('tlVisible', (t.visible?1:0)===1);
      document.getElementById('toolModal').classList.add('active');
    }

    async function saveTool(){
      const name=getVal('tlName'); const status=getVal('tlStatus'); const visible=isChecked('tlVisible')?1:0;
      if (!name){ Swal.fire({icon:'warning', title:'تنبيه', text:'أدخل اسم الأداة'}); return; }
      try{
        const method = editId? 'PUT':'POST';
        const payload = editId? { id: editId, name, status, visible } : { name, status, visible };
        const res = await fetch('api/tools_api.php', { method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        const data = await res.json(); if(!data.success) throw new Error(data.message||'فشل الحفظ');
        closeToolModal(); await loadTools(); Swal.fire({icon:'success', title:'تم', text: editId? 'تم التعديل':'تم الحفظ'});
      }catch(e){ Swal.fire({icon:'error', title:'خطأ', text:e.message||'فشل الحفظ'}); }
    }

    async function deleteTool(id){ const t=tools.find(x=>x.id===id); if(!t) return; const r=await Swal.fire({ title:'حذف أداة', html:`حذف <strong>${escapeHtml(t.name)}</strong>?`, icon:'warning', showCancelButton:true, confirmButtonText:'نعم، حذف', cancelButtonText:'إلغاء', confirmButtonColor:'#d33' }); if(!r.isConfirmed) return; try{ const res=await fetch(`api/tools_api.php/${id}`, { method:'DELETE' }); const d=await res.json(); if(!d.success) throw new Error(d.message||'فشل الحذف'); selected=selected.filter(x=>x!==id); await loadTools(); Swal.fire({icon:'success', title:'تم', text:'تم الحذف'});}catch(e){ Swal.fire({icon:'error', title:'خطأ', text:e.message||'فشل الحذف'}); } }

    async function deleteSelected(){ if(selected.length===0){ Swal.fire({icon:'warning', title:'تنبيه', text:'اختر عناصر للحذف'}); return; } const r=await Swal.fire({ title:'حذف متعدد', html:`سيتم حذف <strong>${selected.length}</strong> عنصر. متابعة؟`, icon:'warning', showCancelButton:true, confirmButtonText:'نعم، حذف', cancelButtonText:'إلغاء', confirmButtonColor:'#d33' }); if(!r.isConfirmed) return; try{ const res=await fetch('api/tools_api.php', { method:'DELETE', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ids: selected }) }); const d=await res.json(); if(!d.success) throw new Error(d.message||'فشل الحذف'); selected=[]; document.getElementById('selectAll').checked=false; await loadTools(); Swal.fire({icon:'success', title:'تم', text:'تم حذف العناصر المحددة'});}catch(e){ Swal.fire({icon:'error', title:'خطأ', text:e.message||'فشل الحذف'}); } }

    function setVal(id,v){ const el=document.getElementById(id); if(el) el.value=v; }
    function getVal(id){ const el=document.getElementById(id); return el? String(el.value||'').trim():''; }
    function setChecked(id,v){ const el=document.getElementById(id); if(el) el.checked=!!v; }
    function isChecked(id){ const el=document.getElementById(id); return !!(el && el.checked); }

    function formatDate(s){ if(!s) return '--'; const d=new Date(s); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}); }
    function escapeHtml(s){ const map={ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;' }; return String(s||'').replace(/[&<>"']/g, ch=>map[ch]); }
  </script>
</body>
</html>
