<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنتجات | Kingmaster</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/rtl-ltr.css">
  <style>
    :root {
      color-scheme: dark;
      --primary: #6c5ce7;
      --primary-light: #a29bfe;
      --secondary: #00cec9;
      --text-light: #f5f6fa;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg-dark);
    }

    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(circle at top right, rgba(108, 92, 231, 0.15), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(0, 206, 201, 0.1), transparent 40%);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-light);
      margin: 0;
      display: flex;
      align-items: center;
      gap: .6rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    .product-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      backdrop-filter: blur(14px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, .35);
      overflow: hidden;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 40px rgba(108, 92, 231, 0.4);
      border-color: var(--primary);
    }

    .product-image {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.1), rgba(118, 75, 162, 0.1));
      position: relative;
    }

    .product-badge {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: var(--primary);
      color: white;
      padding: 0.4rem 0.8rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .product-content {
      padding: 1.5rem;
    }

    .product-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 0.5rem;
    }

    .product-description {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 1rem;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-rating {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .stars {
      color: #fbbf24;
      font-size: 0.9rem;
    }

    .rating-text {
      color: #9ca3af;
      font-size: 0.85rem;
    }

    .product-colors {
      margin-bottom: 1rem;
    }

    .colors-label {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 0.5rem;
    }

    .colors-list {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .color-option {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid var(--glass-border);
      cursor: pointer;
      transition: all 0.3s;
    }

    .color-option:hover {
      transform: scale(1.2);
      border-color: var(--primary);
    }

    .product-sizes {
      margin-bottom: 1rem;
    }

    .sizes-label {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 0.5rem;
    }

    .sizes-list {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .size-option {
      padding: 0.4rem 0.8rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      color: var(--text-light);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .size-option:hover {
      background: var(--primary);
      border-color: var(--primary);
    }

    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .product-stock {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #4ade80;
    }

    .product-price {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-light);
    }

    .filters-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.6rem 1.2rem;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.3s;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
    }

    @media (max-width: 768px) {
      .products-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="rtl ar">
  <div class="bg-gradient"></div>
  <div class="container">
    <div class="header-bar">
      <h1 class="header-title">
        <i class="fas fa-shopping-bag"></i>
        المنتجات
      </h1>
      <button onclick="window.location.href='index.html'" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: #fff; padding: 10px 20px; border-radius: 10px; cursor: pointer;">
        <i class="fas fa-home"></i> الرئيسية
      </button>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
      <button class="filter-btn active" onclick="filterProducts('all')">
        <i class="fas fa-th"></i> الكل
      </button>
      <button class="filter-btn" onclick="filterProducts('new')">
        <i class="fas fa-sparkles"></i> جديد
      </button>
      <button class="filter-btn" onclick="filterProducts('popular')">
        <i class="fas fa-fire"></i> الأكثر مبيعاً
      </button>
      <button class="filter-btn" onclick="filterProducts('sale')">
        <i class="fas fa-tag"></i> تخفيضات
      </button>
    </div>

    <!-- Products Grid -->
    <div class="products-grid" id="productsGrid">
      <!-- Products will be loaded here by JavaScript -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    let products = [];
    
    // جلب المنتجات من قاعدة البيانات
    async function loadProducts(category = 'all') {
      try {
        const response = await fetch(`api/get_products.php?category=${category}`);
        const data = await response.json();
        
        if (data.success) {
          products = data.products;
          renderProducts(products);
        } else {
          Swal.fire({
            icon: 'error',
            title: 'خطأ',
            text: data.message,
            confirmButtonColor: '#6c5ce7'
          });
        }
      } catch (error) {
        Swal.fire({
          icon: 'error',
          title: 'خطأ في الاتصال',
          text: 'تعذر تحميل المنتجات',
          confirmButtonColor: '#6c5ce7'
        });
      }
    }
    
    const oldProducts = [
      {
        id: 1,
        name: 'تيشرت قطن كلاسيك',
        description: 'تيشرت قطن 100% عالي الجودة، مريح وعملي للاستخدام اليومي',
        image: 'https://via.placeholder.com/400x300/667eea/ffffff?text=Product+1',
        price: 149.99,
        rating: 4.5,
        reviewsCount: 128,
        colors: ['#000000', '#ffffff', '#667eea', '#f43f5e'],
        sizes: ['S', 'M', 'L', 'XL', 'XXL'],
        stock: 45,
        badge: 'جديد',
        category: 'new'
      },
      {
        id: 2,
        name: 'بنطلون جينز كلاسيك',
        description: 'جينز عالي الجودة بتصميم عصري ومريح',
        image: 'https://via.placeholder.com/400x300/764ba2/ffffff?text=Product+2',
        price: 299.99,
        rating: 4.8,
        reviewsCount: 256,
        colors: ['#1e3a8a', '#334155', '#000000'],
        sizes: ['28', '30', '32', '34', '36'],
        stock: 32,
        badge: 'الأكثر مبيعاً',
        category: 'popular'
      },
      {
        id: 3,
        name: 'جاكيت شتوي فاخر',
        description: 'جاكيت دافئ ومقاوم للماء مع تصميم أنيق',
        image: 'https://via.placeholder.com/400x300/00cec9/ffffff?text=Product+3',
        price: 599.99,
        rating: 4.7,
        reviewsCount: 89,
        colors: ['#000000', '#374151', '#0f766e'],
        sizes: ['M', 'L', 'XL'],
        stock: 15,
        badge: 'تخفيض 30%',
        category: 'sale'
      },
      {
        id: 4,
        name: 'حذاء رياضي مريح',
        description: 'حذاء رياضي خفيف الوزن مثالي للجري والرياضة',
        image: 'https://via.placeholder.com/400x300/fbbf24/ffffff?text=Product+4',
        price: 449.99,
        rating: 4.6,
        reviewsCount: 342,
        colors: ['#000000', '#ffffff', '#667eea', '#dc2626'],
        sizes: ['40', '41', '42', '43', '44', '45'],
        stock: 67,
        badge: 'جديد',
        category: 'new'
      },
      {
        id: 5,
        name: 'قميص رسمي أنيق',
        description: 'قميص قطني بتصميم رسمي مناسب لجميع المناسبات',
        image: 'https://via.placeholder.com/400x300/a29bfe/ffffff?text=Product+5',
        price: 199.99,
        rating: 4.4,
        reviewsCount: 167,
        colors: ['#ffffff', '#60a5fa', '#000000', '#f8b4b4'],
        sizes: ['S', 'M', 'L', 'XL'],
        stock: 28,
        badge: 'الأكثر مبيعاً',
        category: 'popular'
      },
      {
        id: 6,
        name: 'حقيبة ظهر عملية',
        description: 'حقيبة ظهر متعددة الجيوب مثالية للسفر والعمل',
        image: 'https://via.placeholder.com/400x300/4ade80/ffffff?text=Product+6',
        price: 349.99,
        rating: 4.9,
        reviewsCount: 423,
        colors: ['#000000', '#374151', '#667eea'],
        sizes: ['One Size'],
        stock: 52,
        badge: 'الأكثر مبيعاً',
        category: 'popular'
      }
    ];

    // رسم المنتجات
    function renderProducts(productsToRender) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      productsToRender.forEach(product => {
        const stars = generateStars(parseFloat(product.rating));
        
        // الألوان
        let colors = '';
        if (product.colors && product.colors.length > 0 && !product.is_digital) {
          colors = product.colors.map(color => 
            `<div class="color-option" style="background-color: ${color.color_hex}" title="${color.color_name}"></div>`
          ).join('');
        }
        
        // المقاسات
        let sizes = '';
        if (product.sizes && product.sizes.length > 0 && !product.is_digital) {
          sizes = product.sizes.map(size => 
            `<span class="size-option">${size}</span>`
          ).join('');
        }
        
        // البادج
        let badge = '';
        if (product.is_new == 1) badge = 'جديد';
        else if (product.discount_percentage > 0) badge = `تخفيض ${product.discount_percentage}%`;
        else if (product.is_featured == 1) badge = 'مميز';
        
        // السعر
        const price = product.final_price ? parseFloat(product.final_price) : parseFloat(product.price);
        const originalPrice = product.discount_percentage > 0 ? `<span style="text-decoration: line-through; color: #9ca3af; font-size: 1rem; margin-left: 0.5rem;">${parseFloat(product.price).toFixed(2)}</span>` : '';

        const card = `
          <div class="product-card" onclick="viewProduct(${product.id})">
            <div class="product-image" style="background-image: url('${product.image_url}'); background-size: cover; background-position: center;">
              ${badge ? `<span class="product-badge">${badge}</span>` : ''}
            </div>
            <div class="product-content">
              <h3 class="product-title">${product.name}</h3>
              <p class="product-description">${product.description || ''}</p>
              
              <div class="product-rating">
                <div class="stars">${stars}</div>
                <span class="rating-text">(${product.reviews_count || 0} تقييم)</span>
              </div>

              ${colors ? `
              <div class="product-colors">
                <div class="colors-label">الألوان المتاحة:</div>
                <div class="colors-list">${colors}</div>
              </div>` : ''}

              ${sizes ? `
              <div class="product-sizes">
                <div class="sizes-label">المقاسات:</div>
                <div class="sizes-list">${sizes}</div>
              </div>` : ''}

              <div class="product-footer">
                <div class="product-stock">
                  <i class="fas ${product.is_digital == 1 ? 'fa-cloud-download' : 'fa-box'}"></i>
                  <span>${product.is_digital == 1 ? 'رقمي' : product.stock_quantity + ' قطعة'}</span>
                </div>
                <div class="product-price">${originalPrice}${price.toFixed(2)} ر.س</div>
              </div>
            </div>
          </div>
        `;
        grid.innerHTML += card;
      });
    }

    // توليد النجوم
    function generateStars(rating) {
      const fullStars = Math.floor(rating);
      const hasHalfStar = rating % 1 !== 0;
      let stars = '';

      for (let i = 0; i < fullStars; i++) {
        stars += '<i class="fas fa-star"></i>';
      }
      if (hasHalfStar) {
        stars += '<i class="fas fa-star-half-alt"></i>';
      }
      const emptyStars = 5 - Math.ceil(rating);
      for (let i = 0; i < emptyStars; i++) {
        stars += '<i class="far fa-star"></i>';
      }
      return stars;
    }

    // فلترة المنتجات
    function filterProducts(category) {
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      event.target.closest('.filter-btn').classList.add('active');
      loadProducts(category);
    }

    // عرض تفاصيل المنتج باستخدام SweetAlert
    function viewProduct(id) {
      const product = products.find(p => p.id == id);
      if (!product) return;
      
      const price = product.final_price ? parseFloat(product.final_price) : parseFloat(product.price);
      const discount = product.discount_percentage > 0 ? `<p style="color: #4ade80;"><strong>خصم:</strong> ${product.discount_percentage}%</p>` : '';
      
      Swal.fire({
        title: product.name,
        html: `
          <div style="text-align: right;">
            <img src="${product.image_url}" style="width: 100%; max-height: 300px; object-fit: cover; border-radius: 10px; margin-bottom: 1rem;">
            <p style="color: #9ca3af;">${product.description || ''}</p>
            <hr style="border-color: rgba(255,255,255,0.1);">
            <p><strong>السعر:</strong> ${price.toFixed(2)} ر.س</p>
            ${discount}
            <p><strong>المخزون:</strong> ${product.is_digital == 1 ? 'رقمي - غير محدود' : product.stock_quantity + ' قطعة'}</p>
            <p><strong>التقييم:</strong> ${product.rating} ⭐ (${product.reviews_count} تقييم)</p>
          </div>
        `,
        icon: 'info',
        confirmButtonText: 'إغلاق',
        confirmButtonColor: '#6c5ce7',
        width: '600px'
      });
    }

    // تحميل المنتجات عند فتح الصفحة
    loadProducts('all');
  </script>
</body>
</html>
