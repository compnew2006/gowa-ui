<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Whatomate - WhatsApp Business Platform" />
    <title>Whatomate</title>
    <script>
      (function () {
        var mode = localStorage.getItem("color-mode") || "system";
        var preset = localStorage.getItem("theme-preset") || "twitter";
        if (preset === "caffeine") {
          preset = "soft-pop";
        }
        var isDark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        var root = document.documentElement;
        root.classList.toggle("dark", isDark);
        root.classList.toggle("light", !isDark);
        root.dataset.themePreset =
          preset === "ocean-breeze" ||
          preset === "soft-pop" ||
          preset === "amber-minimal"
            ? preset
            : "twitter";
        root.style.colorScheme = isDark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
