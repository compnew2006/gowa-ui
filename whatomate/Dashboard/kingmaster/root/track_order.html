<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تتبع الشحنة | Kingmaster</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #6c5ce7;
      --primary-light: #a29bfe;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
      --glass-bg: rgba(255, 255, 255, 0.1);
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-light: #f5f6fa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', sans-serif;
      background: #0f172a;
      color: var(--text-light);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .bg-gradient {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: radial-gradient(circle at top right, rgba(108, 92, 231, 0.15), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(0, 206, 201, 0.1), transparent 40%);
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .header-icon {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2.5rem;
      color: white;
      box-shadow: 0 10px 30px rgba(108, 92, 231, 0.3);
    }

    .header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .header p {
      color: #9ca3af;
      font-size: 1rem;
    }

    .search-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      padding: 2.5rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      margin-bottom: 2rem;
    }

    .search-label {
      display: block;
      margin-bottom: 1rem;
      font-weight: 600;
      font-size: 1rem;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      gap: 1rem;
    }

    .search-input {
      flex: 1;
      padding: 1.2rem 1.5rem;
      border: 2px solid var(--glass-border);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      color: white;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      transition: all 0.3s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.08);
    }

    .search-btn {
      padding: 1.2rem 2.5rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border: none;
      border-radius: 16px;
      color: white;
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(108, 92, 231, 0.4);
    }

    .search-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hint {
      text-align: center;
      color: #9ca3af;
      font-size: 0.9rem;
      margin-top: 1rem;
    }

    .result-section {
      display: none;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .order-info-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      padding: 2rem;
      margin-bottom: 2rem;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .order-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-light);
    }

    .order-date {
      color: #9ca3af;
      font-size: 0.9rem;
    }

    .order-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .detail-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    .detail-icon {
      width: 45px;
      height: 45px;
      background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(118, 75, 162, 0.2));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-light);
      font-size: 1.2rem;
    }

    .detail-content h4 {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 0.3rem;
    }

    .detail-content p {
      font-size: 1rem;
      font-weight: 600;
    }

    /* Progress Tracker */
    .progress-tracker {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      padding: 2.5rem;
      margin-bottom: 2rem;
    }

    .tracker-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .progress-steps {
      position: relative;
      display: flex;
      justify-content: space-between;
      margin-bottom: 3rem;
    }

    .progress-line {
      position: absolute;
      top: 35px;
      right: 0;
      left: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 0;
    }

    .progress-line-fill {
      position: absolute;
      top: 0;
      right: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      transition: width 1s ease;
      border-radius: 4px;
    }

    .step {
      position: relative;
      z-index: 1;
      text-align: center;
      flex: 1;
    }

    .step-circle {
      width: 70px;
      height: 70px;
      background: rgba(255, 255, 255, 0.05);
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      font-size: 1.8rem;
      transition: all 0.5s;
    }

    .step.completed .step-circle {
      background: linear-gradient(135deg, var(--success), #059669);
      border-color: var(--success);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
      animation: pulse 2s infinite;
    }

    .step.active .step-circle {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-color: var(--primary);
      box-shadow: 0 0 25px rgba(108, 92, 231, 0.6);
      animation: pulse 2s infinite;
    }

    .step.rejected .step-circle {
      background: linear-gradient(135deg, var(--danger), #dc2626);
      border-color: var(--danger);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .step-label {
      font-weight: 600;
      font-size: 0.95rem;
      color: #9ca3af;
    }

    .step.completed .step-label,
    .step.active .step-label {
      color: var(--text-light);
    }

    .step.rejected .step-label {
      color: var(--danger);
    }

    /* Timeline */
    .timeline-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      padding: 2.5rem;
    }

    .timeline-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 2rem;
    }

    .timeline {
      position: relative;
      padding-right: 2rem;
    }

    .timeline::before {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, var(--primary), rgba(108, 92, 231, 0.2));
    }

    .timeline-item {
      position: relative;
      padding-right: 2.5rem;
      margin-bottom: 2rem;
      animation: slideIn 0.5s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      right: -0.5rem;
      top: 0;
      width: 1rem;
      height: 1rem;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(108, 92, 231, 0.5);
    }

    .timeline-content {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .timeline-status {
      font-weight: 700;
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: var(--primary-light);
    }

    .timeline-notes {
      color: #9ca3af;
      margin-bottom: 0.5rem;
    }

    .timeline-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .rejection-alert {
      background: rgba(239, 68, 68, 0.1);
      border: 2px solid var(--danger);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      text-align: center;
    }

    .rejection-alert .icon {
      font-size: 3rem;
      color: var(--danger);
      margin-bottom: 1rem;
    }

    .rejection-alert h3 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
    }

    .rejection-alert p {
      color: #fca5a5;
    }

    @media (max-width: 768px) {
      .progress-steps {
        flex-direction: column;
        align-items: center;
      }

      .progress-line {
        width: 4px;
        height: 100%;
        top: 0;
        right: 50%;
        transform: translateX(50%);
      }

      .step {
        margin-bottom: 2rem;
      }

      .search-wrapper {
        flex-direction: column;
      }

      .order-details {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="container">
    <div class="header">
      <div class="header-icon">
        <i class="fas fa-shipping-fast"></i>
      </div>
      <h1>تتبع حالة الشحنة</h1>
      <p>أدخل رقم الطلب أو كود التتبع لمعرفة حالة شحنتك</p>
    </div>

    <div class="search-card">
      <label class="search-label">
        <i class="fas fa-search"></i>
        رقم الطلب أو كود التتبع
      </label>
      <div class="search-wrapper">
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="مثال: ORD-2025-0001 أو TRK-001"
          autocomplete="off"
        >
        <button id="searchBtn" class="search-btn" onclick="trackOrder()">
          <i class="fas fa-search"></i>
          <span>تتبع</span>
        </button>
      </div>
      <div class="hint">
        <i class="fas fa-info-circle"></i>
        يمكنك استخدام رقم الطلب أو كود التتبع للبحث
      </div>
    </div>

    <div class="result-section" id="resultSection">
      <!-- النتائج ستظهر هنا -->
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script>
    let currentOrder = null;

    // البحث عن الطلب
    async function trackOrder() {
      const input = document.getElementById('searchInput').value.trim();
      const searchBtn = document.getElementById('searchBtn');
      const resultSection = document.getElementById('resultSection');
      
      if (!input) {
        Swal.fire({
          icon: 'warning',
          title: 'تنبيه',
          text: 'يرجى إدخال رقم الطلب أو كود التتبع',
          confirmButtonColor: '#6c5ce7'
        });
        return;
      }

      // تعطيل الزر وإظهار التحميل
      searchBtn.disabled = true;
      searchBtn.innerHTML = '<div class="spinner"></div><span>جارِ البحث...</span>';
      resultSection.style.display = 'none';

      try {
        const response = await fetch('api/track_order.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ search: input })
        });

        const data = await response.json();

        if (data.success) {
          currentOrder = data;
          displayOrderTracking(data);
          resultSection.style.display = 'block';
        } else {
          Swal.fire({
            icon: 'error',
            title: 'غير موجود',
            text: data.message,
            confirmButtonColor: '#6c5ce7'
          });
        }
      } catch (error) {
        Swal.fire({
          icon: 'error',
          title: 'خطأ',
          text: 'حدث خطأ في الاتصال. يرجى المحاولة لاحقاً',
          confirmButtonColor: '#6c5ce7'
        });
      } finally {
        searchBtn.disabled = false;
        searchBtn.innerHTML = '<i class="fas fa-search"></i><span>تتبع</span>';
      }
    }

    // عرض تتبع الطلب
    function displayOrderTracking(data) {
      const order = data.order;
      const history = data.history;
      const statusNames = data.status_names;

      const resultSection = document.getElementById('resultSection');
      
      // إنشاء HTML للنتائج
      let html = '';

      // بطاقة معلومات الطلب
      html += `
        <div class="order-info-card">
          <div class="order-header">
            <div>
              <div class="order-number">${order.order_number}</div>
              <div class="order-date">تاريخ الطلب: ${formatDate(order.created_at)}</div>
            </div>
          </div>
          <div class="order-details">
            <div class="detail-item">
              <div class="detail-icon"><i class="fas fa-user"></i></div>
              <div class="detail-content">
                <h4>اسم العميل</h4>
                <p>${order.customer_name}</p>
              </div>
            </div>
            <div class="detail-item">
              <div class="detail-icon"><i class="fas fa-envelope"></i></div>
              <div class="detail-content">
                <h4>البريد الإلكتروني</h4>
                <p>${order.customer_email}</p>
              </div>
            </div>
            <div class="detail-item">
              <div class="detail-icon"><i class="fas fa-phone"></i></div>
              <div class="detail-content">
                <h4>رقم الهاتف</h4>
                <p>${order.customer_phone || 'غير متوفر'}</p>
              </div>
            </div>
            <div class="detail-item">
              <div class="detail-icon"><i class="fas fa-dollar-sign"></i></div>
              <div class="detail-content">
                <h4>المبلغ الإجمالي</h4>
                <p>${parseFloat(order.total_amount).toFixed(2)} ر.س</p>
              </div>
            </div>
          </div>
        </div>
      `;

      // رسالة الرفض إن وجدت
      if (order.status === 'rejected' && order.rejection_reason) {
        html += `
          <div class="rejection-alert">
            <div class="icon"><i class="fas fa-times-circle"></i></div>
            <h3>تم رفض الطلب</h3>
            <p>${order.rejection_reason}</p>
          </div>
        `;
      }

      // مؤشر التقدم
      html += generateProgressTracker(order.status);

      // السجل الزمني
      html += generateTimeline(history, statusNames);

      resultSection.innerHTML = html;
    }

    // إنشاء مؤشر التقدم
    function generateProgressTracker(currentStatus) {
      const steps = [
        { id: 'pending', icon: 'fa-clock', label: 'بانتظار المراجعة' },
        { id: 'verified', icon: 'fa-check-circle', label: 'تم التحقق' },
        { id: 'preparing', icon: 'fa-box', label: 'قيد التحضير' },
        { id: 'shipped', icon: 'fa-truck', label: 'تم الشحن' },
        { id: 'delivered', icon: 'fa-home', label: 'تم التسليم' }
      ];

      const statusOrder = ['pending', 'verified', 'preparing', 'shipped', 'delivered'];
      const currentIndex = statusOrder.indexOf(currentStatus);
      
      // حساب نسبة التقدم
      const progressPercentage = currentStatus === 'rejected' ? 0 : (currentIndex / (statusOrder.length - 1)) * 100;

      let html = `
        <div class="progress-tracker">
          <h2 class="tracker-title">مراحل الطلب</h2>
          <div class="progress-steps">
            <div class="progress-line">
              <div class="progress-line-fill" style="width: ${progressPercentage}%"></div>
            </div>
      `;

      steps.forEach((step, index) => {
        let stepClass = '';
        if (currentStatus === 'rejected' && step.id === 'pending') {
          stepClass = 'rejected';
        } else if (index < currentIndex) {
          stepClass = 'completed';
        } else if (index === currentIndex) {
          stepClass = 'active';
        }

        html += `
          <div class="step ${stepClass}">
            <div class="step-circle">
              <i class="fas ${step.icon}"></i>
            </div>
            <div class="step-label">${step.label}</div>
          </div>
        `;
      });

      html += `
          </div>
        </div>
      `;

      return html;
    }

    // إنشاء السجل الزمني
    function generateTimeline(history, statusNames) {
      let html = `
        <div class="timeline-card">
          <h2 class="timeline-title">
            <i class="fas fa-history"></i>
            سجل الحالات
          </h2>
          <div class="timeline">
      `;

      history.forEach((item, index) => {
        html += `
          <div class="timeline-item" style="animation-delay: ${index * 0.1}s">
            <div class="timeline-content">
              <div class="timeline-status">
                <i class="fas fa-circle" style="font-size: 0.5rem; margin-left: 0.5rem;"></i>
                ${statusNames[item.status]}
              </div>
              ${item.notes ? `<div class="timeline-notes">${item.notes}</div>` : ''}
              <div class="timeline-meta">
                <span><i class="fas fa-user"></i> ${item.created_by}</span>
                <span><i class="fas fa-clock"></i> ${formatDateTime(item.created_at)}</span>
              </div>
            </div>
          </div>
        `;
      });

      html += `
          </div>
        </div>
      `;

      return html;
    }

    // تنسيق التاريخ
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('ar-SA', { 
        year: 'numeric', 
        month: 'long', 
        day: 'numeric' 
      });
    }

    // تنسيق التاريخ والوقت
    function formatDateTime(dateString) {
      const date = new Date(dateString);
      return date.toLocaleString('ar-SA', { 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // البحث عند الضغط على Enter
    document.getElementById('searchInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        trackOrder();
      }
    });
  </script>
</body>
</html>
